<!DOCTYPE html>
<!-- GOOS-PHONE-APP -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A4A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>GOOS</title>
<style>
:root{--cream:#FAF5EA;--navy:#1F2A4A;--peri:#8C9BE0;--wheat:#E0B54A;--ok:#256B45;
 --warn:#8F6111;--fail:#9E2E2E;--line:#D8CFBB;--card:#fff;--muted:#5E6C89}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--navy);overflow-x:hidden;
 font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:31;background:var(--navy);color:#fff;
 padding:12px 14px calc(10px) 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0}
header .rf{background:var(--wheat);color:var(--navy);border:0;border-radius:18px;
 padding:6px 12px;font-weight:700;font-size:14px}
main{padding:12px 12px 80px;max-width:760px;margin:0 auto}
.stamp{color:var(--muted);font-size:12px;margin:2px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.kpi span{color:var(--muted);font-size:13px}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--fail)} .kpi.go{cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row.tap{cursor:pointer}
.row .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.row .t span:first-child{min-width:0;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px;margin-top:2px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;
 background:#EEF0FA;color:var(--navy)}
.pill.ok{background:#E3F1E8;color:var(--ok)} .pill.warn{background:#FBF0D9;color:var(--warn)}
.pill.bad{background:#F7E1E1;color:var(--fail)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
 background:#fff;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;
 font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum{background:var(--navy);color:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.sum b{font-size:22px}
header .menu{background:none;border:0;color:#fff;font-size:24px;line-height:1;padding:0 4px 0 0}
nav{position:fixed;top:52px;left:8px;z-index:30;background:#fff;border:1px solid var(--line);
 border-radius:14px;box-shadow:0 8px 28px rgba(31,42,74,.25);display:none;flex-direction:column;
 min-width:220px;max-height:75vh;overflow:auto;padding:6px}
nav.on{display:flex}
nav button{background:none;border:0;padding:12px 14px;text-align:left;font-size:16px;
 color:var(--navy);border-radius:10px}
nav button.on{background:#EEF0FA;font-weight:700}
nav button.out{color:var(--fail);border-top:1px solid var(--line);border-radius:0 0 10px 10px}
#scrim{position:fixed;inset:0;z-index:29;display:none}
#scrim.on{display:block}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}
.login h2{margin:0 0 4px;font-size:28px} .login p{color:var(--muted);margin:0 0 18px}
.login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);margin-top:14px}
.err{color:var(--fail);min-height:22px;margin:8px 0}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.det td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.det{width:100%;border-collapse:collapse;background:#fff;border-radius:12px}
.num{text-align:right;white-space:nowrap}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
a.tel{color:var(--navy)}
.ck{width:22px;height:22px;flex:0 0 auto;margin:2px 10px 0 0;accent-color:var(--navy)}
.arow{display:flex;align-items:flex-start}
.arow .body{flex:1;min-width:0}
.prev{margin:6px 0 0;padding:0 0 0 2px;font-size:13px;color:var(--navy)}
.prev div{margin:2px 0}
.prob{color:var(--fail);font-weight:600}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;background:#EEF0FA}
.banner.warn{background:#FBF0D9;color:var(--warn)}
.actbar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;display:flex;gap:8px;
 background:rgba(250,245,234,.96);border-top:1px solid var(--line);z-index:6}
.actbar button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:700;color:#fff;background:var(--ok)}
.actbar button.rej{background:var(--fail)}
#sheet{position:fixed;inset:0;background:rgba(31,42,74,.45);z-index:20;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .box{background:var(--cream);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
 padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 6px;font-size:20px}
#sheet input,#sheet textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:4px 0 8px;background:#fff}
#sheet label{font-size:13px;color:var(--muted)}
#sheet .two{display:flex;gap:8px} #sheet .two .btn{flex:1}
.fld{margin-bottom:8px}
.fld label{display:block;font-size:13px;color:var(--muted);margin:0 2px 3px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.two2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qline{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.qline .x{float:right;background:none;border:0;color:var(--fail);font-size:20px;line-height:1;padding:0 4px}
.qline .lt{text-align:right;font-weight:700;margin-top:4px}
.tot{background:var(--navy);color:#fff;border-radius:14px;padding:12px;margin:10px 0}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-size:20px;font-weight:800;margin-top:4px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar2 .btn{flex:1 1 140px;width:auto}
.paper{background:#fff;color:#1F2A4A;border:1px solid var(--line);border-radius:6px;padding:16px;font-size:13px;line-height:1.4}
.paper .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid #1F2A4A;padding-bottom:8px}
.paper .co{font-size:17px;font-weight:800}
.paper .sm{font-size:11px;color:#5E6C89}
.paper .dt{text-align:right;font-weight:800;letter-spacing:.08em}
.paper .dt img{max-height:44px;max-width:140px;display:block;margin:0 0 4px auto}
.paper h1{font-size:20px;margin:10px 0 2px}
.paper .mt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin:8px 0;font-size:12px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0}
.paper th{background:#1F2A4A;color:#fff;font-size:11px;text-align:left;padding:5px}
.paper td{border-bottom:1px solid #E4DCCB;padding:5px;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}
.paper .gt td{font-weight:800;font-size:15px;border-top:2px solid #1F2A4A}
.paper .sig{margin-top:34px;border-top:1px solid #1F2A4A;width:60%;font-size:11px;padding-top:3px}
#print{display:none}
@media print{
 #app,#sheet,nav,header{display:none!important}
 #print{display:block} body{background:#fff}
 #print .paper{border:0;font-size:12px}
}
</style>
</head><body>
<div id="app"></div><div id="sheet"></div><div id="print"></div>
<script>
'use strict';
var CFG = {url: 'https://gfgavltifdkyzvmhyyim.supabase.co', key: 'sb_publishable_CQ1ChWjD5ZPNlZZXCK71FA_704f-xRp', version: '3.99.9'};
var VIEWS = {
  dashboard: 'Dashboard', quotes: 'Quotations', orders: 'Orders', collections: 'Collections',
  customers: 'Customers', finished: 'Finished Goods', lots: 'LOTs',
  raw: 'Raw Materials', qa: 'QA', approvals: 'For Approval'
};
// Menu order: Dashboard first, then what most often needs a decision.
var ORDER = ['dashboard', 'approvals', 'quotes', 'orders', 'collections', 'customers',
             'finished', 'lots', 'raw', 'qa'];
function sortViews(v) {
  var out = (v || []).slice();
  if (out.indexOf('dashboard') < 0) out.unshift('dashboard');
  out.sort(function (a, b) {
    var x = ORDER.indexOf(a), y = ORDER.indexOf(b);
    return (x < 0 ? 99 : x) - (y < 0 ? 99 : y);
  });
  return out;
}
var S = {token: '', name: '', user: '', views: [], view: 'dashboard', arg: '', data: null,
         at: '', q: '', filter: '', busy: false, sel: {}, poll: 0, qf: null};
function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function peso(n) {
  n = Number(n || 0);
  return '\u20B1' + n.toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function pesoShort(n) {
  /* a card holds a headline, not a ledger line - the full figure is one tap away */
  n = Number(n || 0);
  var a = Math.abs(n);
  if (a >= 1e6) return '\u20B1' + (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return '\u20B1' + (n / 1e3).toFixed(1) + 'K';
  return peso(n);
}
function num(n) {
  n = Number(n || 0);
  return n.toLocaleString('en-PH', {maximumFractionDigits: 2});
}
function save() {
  try { localStorage.setItem('goos_phone', JSON.stringify({token: S.token, name: S.name, user: S.user, views: S.views})); }
  catch (e) {}
}
function load() {
  try {
    var v = JSON.parse(localStorage.getItem('goos_phone') || '{}');
    S.token = v.token || ''; S.name = v.name || ''; S.user = v.user || ''; S.views = v.views || [];
  } catch (e) {}
}
async function rpc(fn, body) {
  var h = {'Content-Type': 'application/json', 'apikey': CFG.key};
  if (/^eyJ/.test(CFG.key)) h['Authorization'] = 'Bearer ' + CFG.key;
  var r = await fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn,
                      {method: 'POST', headers: h, body: JSON.stringify(body)});
  if (!r.ok) throw new Error('The server said ' + r.status + '.');
  return r.json();
}
async function pbkdf2Hex(password, saltHex) {
  var enc = new TextEncoder();
  var salt = new Uint8Array(saltHex.match(/../g).map(function (h) { return parseInt(h, 16); }));
  var key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: 100000}, key, 256);
  return Array.prototype.map.call(new Uint8Array(bits), function (b) {
    return ('0' + b.toString(16)).slice(-2);
  }).join('');
}

/* ---------------------------------------------------------------- sign in */
function drawLogin(msg) {
  $('app').innerHTML =
    '<div class="login"><h2>GOOS</h2><p>Grain Ola. Approvals can be signed here; everything else is changed in GOOS on the laptops.</p>' +
    '<input id="u" autocomplete="username" placeholder="Username" autocapitalize="none">' +
    '<input id="p" type="password" autocomplete="current-password" placeholder="Password">' +
    '<div class="err" id="err">' + esc(msg || '') + '</div>' +
    '<button class="btn" id="go">Sign in</button>' +
    '<div class="foot">App ' + esc(CFG.version) + '</div></div>';
  $('go').onclick = signIn;
  $('p').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };
}
async function signIn() {
  var u = $('u').value.trim(), p = $('p').value;
  if (!u || !p) { $('err').textContent = 'Enter your username and password.'; return; }
  $('go').disabled = true; $('err').textContent = 'Signing in...';
  try {
    var salt = await rpc('goos_m_salt', {p_user: u});
    var h = await pbkdf2Hex(p, String(salt));
    var r = await rpc('goos_m_login', {p_user: u, p_hash: h});
    if (!r.ok) { $('err').textContent = r.error; $('go').disabled = false; return; }
    S.token = r.token; S.name = r.name; S.user = u; S.views = r.views; save();
    go('dashboard');
  } catch (e) {
    $('err').textContent = 'Could not reach GOOS. Check the internet and try again.';
    $('go').disabled = false;
  }
}
async function signOut() {
  try { await rpc('goos_m_logout', {p_token: S.token}); } catch (e) {}
  S.token = ''; save(); drawLogin('');
}

/* ------------------------------------------------------------------ data */
async function go(view, arg) {
  S.view = view; S.arg = arg || ''; S.q = ''; S.filter = ''; S.sel = {};
  S.data = null; draw(); await refresh();
}
async function refresh() {
  if (S.busy) return;
  S.busy = true; drawHead();
  try {
    var r = await rpc('goos_m_data', {p_token: S.token, p_view: S.view, p_arg: S.arg});
    if (!r.ok) {
      if (r.error === 'signin') { S.token = ''; save(); drawLogin('Please sign in again.'); return; }
      S.data = {error: r.error};
    } else {
      S.data = r.data; S.at = r.at;
      if (S.view === 'dashboard' && r.data && r.data.views) {
        S.views = r.data.views; if (r.data.user) S.user = r.data.user; save();
      }
    }
  } catch (e) {
    S.data = S.data || {error: 'Could not reach GOOS. Check the internet, then press Refresh.'};
  } finally {
    S.busy = false;
  }
  draw();
}

/* ---------------------------------------------------------------- screens */
function drawHead() {
  var b = $('rf'); if (b) b.textContent = S.busy ? '...' : 'Refresh';
}
function draw() {
  var title = !S.arg ? VIEWS[S.view] :
    S.view === 'quotes' ? (S.arg === 'form' ? (S.qf && S.qf.id ? 'Edit quotation' : 'New quotation') : 'Quotation') :
    S.view === 'collections' ? (S.arg === 'mine' ? 'Payments you recorded' : 'Record payment') : 'Order';
  S.views = sortViews(S.views);
  var html = '<header><button class="menu" id="menu" aria-label="Menu">&#9776;</button>' +
    (S.arg ? '<button class="back" id="back">&lsaquo;</button>' : '') +
    '<h1>' + esc(title) + '</h1><button class="rf" id="rf">' + (S.busy ? '...' : 'Refresh') + '</button></header><main>';
  if (S.at) html += '<div class="stamp">Updated ' + esc(S.at) + '</div>';
  var d = S.data;
  if (!d) html += '<div class="empty">Loading...</div>';
  else if (d.error) html += '<div class="empty">' + esc(d.error) + '</div>';
  else html += (SCREENS[S.view] || function () { return ''; })(d);
  html += '</main><div id="scrim"></div><nav id="nav">' + S.views.map(function (v) {
    return '<button data-v="' + v + '" class="' + (v === S.view ? 'on' : '') + '">' + esc(VIEWS[v] || v) + '</button>';
  }).join('') + '<button data-v="__out" class="out">Sign out</button></nav>';
  $('app').innerHTML = html;
  $('rf').onclick = refresh;
  var shut = function () { $('nav').classList.remove('on'); $('scrim').classList.remove('on'); };
  $('menu').onclick = function () { $('nav').classList.toggle('on'); $('scrim').classList.toggle('on'); };
  $('scrim').onclick = shut;
  if ($('back')) $('back').onclick = function () { go(S.view); };
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
    b.onclick = function () { shut(); b.dataset.v === '__out' ? signOut() : go(b.dataset.v); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (el) {
    el.onclick = function () {
      var p = el.dataset.go.split(':');
      if (S.views.indexOf(p[0]) >= 0) go(p[0], p[1] || '');
    };
  });
  var s = $('q');
  if (s) {
    s.value = S.q;
    s.oninput = function () { S.q = s.value; var pos = s.selectionStart; draw(); var n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
  }
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.onclick = function () { S.filter = c.dataset.f; draw(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.ck'), function (c) {
    c.onchange = function () {
      if (c.checked) S.sel[c.dataset.k] = 1; else delete S.sel[c.dataset.k];
      draw();
    };
  });
  if ($('do-ok')) $('do-ok').onclick = function () { openSign('approve'); };
  if (S.view === 'quotes' && S.arg === 'form' && S.data && !S.data.error) wireEditor();
  if (S.view === 'quotes' && S.arg && S.arg !== 'form' && S.data && !S.data.error) wireQuoteView();
  if (S.view === 'collections' && S.arg && S.arg !== 'mine' && S.data && !S.data.error) wirePay();
  if ($('q-new')) $('q-new').onclick = function () { S.qf = null; go('quotes', 'form'); };
  if ($('do-no')) $('do-no').onclick = function () { openSign('reject'); };
}
function search(ph) { return '<input id="q" class="search" placeholder="' + esc(ph) + '">'; }
function hit(o, keys) {
  var q = S.q.trim().toLowerCase(); if (!q) return true;
  return keys.some(function (k) { return String(o[k] || '').toLowerCase().indexOf(q) >= 0; });
}
function chips(list) {
  return '<div class="chips">' + list.map(function (c) {
    return '<button class="chip ' + (S.filter === c[0] ? 'on' : '') + '" data-f="' + c[0] + '">' + esc(c[1]) + '</button>';
  }).join('') + '</div>';
}
function rows(items, fn) {
  if (!items.length) return '<div class="empty">Nothing to show.</div>';
  var more = items.length > 300 ? '<div class="empty">Showing the first 300 - search to narrow down.</div>' : '';
  return '<div class="list">' + items.slice(0, 300).map(fn).join('') + '</div>' + more;
}
var STATE = {'new': ['Draft', ''], confirmed: ['Confirmed', 'warn'], dispatched: ['Dispatched', 'ok'],
             recorded: ['Recorded', 'ok'], cancelled: ['Cancelled', 'bad']};
function kpi(v, label, cls, link) {
  return '<div class="kpi ' + (cls || '') + (link ? ' go' : '') + '"' + (link ? ' data-go="' + link + '"' : '') +
         '><b>' + v + '</b><span>' + esc(label) + '</span></div>';
}
var SCREENS = {
  dashboard: function (d) {
    return '<p style="margin:0 0 10px">Hello, <b>' + esc(d.name) + '</b></p><div class="grid">' +
      kpi(d.deliveries_today, 'Deliveries today', '', 'orders') +
      kpi(d.orders_confirmed, 'Confirmed, waiting to dispatch', d.orders_confirmed ? 'warn' : '', 'orders') +
      kpi(d.orders_new, 'Orders still in Drafts', '', 'orders') +
      kpi(pesoShort(d.sales_month), 'Sales this month', '', '') +
      kpi(pesoShort(d.owed), d.owed_count + ' unpaid deliveries', d.owed > 0 ? 'warn' : '', 'collections') +
      kpi(d.approvals, 'Waiting for approval', d.approvals ? 'warn' : '', 'approvals') +
      kpi(d.raw_low, 'Materials at reorder level', d.raw_low ? 'bad' : '', 'raw') +
      kpi(d.fg_out, 'Finished goods out of stock', d.fg_out ? 'bad' : '', 'finished') +
      kpi(d.lots_expiring, 'LOTs expiring in 30 days', d.lots_expiring ? 'warn' : '', 'lots') +
      kpi(d.qa_open, 'Batches still being checked', '', 'qa') + '</div>' +
      '<h3 style="margin:16px 0 8px;font-size:16px">Who is on GOOS now</h3>' +
      ((d.online || []).length ? '<div class="list">' + d.online.map(function (p) {
        return '<div class="row"><div class="t"><span>' + esc(p.name) + '</span><span class="pill ok">' + esc(p.page || '-') +
          '</span></div><div class="s"><span>' + esc(p.role || '') + '</span><span>' + (p.ago < 60 ? 'just now' : Math.round(p.ago / 60) + ' min ago') + '</span></div></div>';
      }).join('') + '</div>' : '<div class="empty">No one is signed in on a laptop right now.</div>') +
      '<div class="foot">On the phone: approvals, quotations and payments. Everything else is changed in GOOS on the laptops. App ' + esc(CFG.version) + '</div>';
  },
  orders: function (d) {
    if (S.arg) return orderDetail(d);
    var f = S.filter;
    var list = d.filter(function (o) {
      return (!f || o.state === f || (f === 'unpaid' && (o.state === 'dispatched' || o.state === 'recorded') && o.total - o.paid > 0.009)) &&
             hit(o, ['reference', 'customer_name']);
    });
    return search('Search order or customer') +
      chips([['', 'All'], ['new', 'Drafts'], ['confirmed', 'Confirmed'], ['dispatched', 'Dispatched'], ['unpaid', 'Unpaid']]) +
      rows(list, function (o) {
        var st = STATE[o.state] || [o.state, ''];
        return '<div class="row tap" data-go="orders:' + o.id + '"><div class="t"><span>' + esc(o.customer_name) +

async function submitSign(action, keys) {
  var name = $('sg-name').value.trim(), pos = $('sg-pos').value.trim(), pw = $('sg-pw').value;
  var note = $('sg-note').value.trim(), user = S.user || ($('sg-user') ? $('sg-user').value.trim() : '');
  var err = $('sg-err');
  if (!name || pos.length < 2 || !pw || !user) { err.textContent = 'Type your full name, your position and your password to sign.'; return; }
  if (action === 'reject' && !note) { err.textContent = 'Type the reason for rejecting.'; return; }
  $('sg-go').disabled = true; err.textContent = 'Signing...';
  var byKind = {};
  keys.forEach(function (k) { var p = k.split(':'); (byKind[p[0]] = byKind[p[0]] || []).push(p[1]); });
  var queued = 0, skipped = [], fail = '';
  try {
    var salt = await rpc('goos_m_salt', {p_user: user});
    var h = await pbkdf2Hex(pw, String(salt));
    for (var kind in byKind) {
      var r = await rpc('goos_m_decide', {p_token: S.token, p_kind: kind, p_ids: byKind[kind].join(','),
        p_action: action, p_name: name, p_position: pos, p_hash: h, p_note: note});
      if (!r.ok) {
        if (r.error === 'signin') { $('sheet').className = ''; S.token = ''; save(); drawLogin('Please sign in again.'); return; }
        fail = r.error; break;
      }
      queued += r.queued; skipped = skipped.concat(r.skipped || []);
    }
  } catch (e) {
    fail = 'Could not reach GOOS. Check the internet and try again.';
  }
  if (fail && !queued) { err.textContent = fail; $('sg-go').disabled = false; return; }
  try { localStorage.setItem('goos_position', pos); } catch (e) {}
  S.sel = {};
  $('sheet').innerHTML = '<div class="box"><h2>' + (queued ? 'Signed' : 'Nothing signed') + '</h2>' +
    '<p>' + queued + ' item(s) sent. A GOOS laptop carries them out within a minute - watch "Your recent decisions".</p>' +
    (skipped.length ? '<p class="prob">Not sent:<br>' + skipped.map(esc).join('<br>') + '</p>' : '') +
    (fail ? '<p class="prob">' + esc(fail) + '</p>' : '') +
    '<button class="btn" id="sg-done">OK</button></div>';
  $('sg-done').onclick = function () { $('sheet').className = ''; $('sheet').innerHTML = ''; };
  S.poll = 24;
  await refresh();
  schedulePoll();
}
function schedulePoll() {
  /* watch the result arrive, without making anyone press Refresh */
  var watch = S.view === 'approvals' ? ((S.data && S.data.decisions) || []) :
              (S.view === 'collections' && S.arg === 'mine' && Array.isArray(S.data) ? S.data : null);
  if (S.poll <= 0 || !watch) return;
  var dec = watch;
  if (!dec.some(function (x) { return x.status === 'queued' || x.status === 'working'; })) { S.poll = 0; return; }
  S.poll -= 1;
  setTimeout(async function () {
    if ($('sheet').className === 'on') { schedulePoll(); return; }
    await refresh(); schedulePoll();
  }, 5000);
}

async function shareQuoteImage(d) {
  /* drawn at a fixed A4-ish width so the picture looks the same on every phone */
  var msg = $('q-msg'); msg.textContent = 'Making the picture...';
  try {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-10000px;top:0;width:760px;background:#fff';
    box.innerHTML = quoteDoc(d);
    document.body.appendChild(box);
    var canvas = await window.html2canvas(box.firstChild, {scale: 2, backgroundColor: '#ffffff', useCORS: true});
    box.remove();
    var name = (d.quote.reference + ' - ' + d.quote.customer_name).replace(/[^A-Za-z0-9 ._-]/g, '') + '.png';
    var blob = await new Promise(function (ok) { canvas.toBlob(ok, 'image/png'); });
    var file = new File([blob], name, {type: 'image/png'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: d.quote.reference});
      msg.textContent = '';
    } else {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = 'Picture saved to your Downloads.';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') { msg.textContent = ''; return; }
    msg.textContent = 'Could not make the picture here - use Save as PDF, or take a screenshot.';
  }
}
function blankQuote(me) {
  return {id: '', customer_id: '', customer_name: '', address: '', contact_person: '', contact_no: '',
          agent: me || S.name, payment_terms: 'Online Transfer', delivery_terms: 'Scheduled', validity: '7 days',
          notes: '', vat_rate: 0.12, discount: '', delivery_fee: '', lines: [{code: '', name: '', size: '', vat: '', qty: '', price: ''}]};
}
function fld(label, id, val, type, extra) {
  return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label><input id="' + id + '" type="' + (type || 'text') +
    '" value="' + esc(val == null ? '' : val) + '"' + (extra || '') + '></div>';
}
function priceKey(p) { return [p.code, p.name, p.size].filter(Boolean).join(' | '); }
function quoteEditor(d) {
  if (!S.qf) S.qf = blankQuote(d.me);
  var q = S.qf;
  var opts = d.prices.map(function (p, i) { return '<option value="' + i + '">' + esc(priceKey(p)) + ' - ' + pesoP(p.price) + '</option>'; }).join('');
  var html = '<datalist id="custlist">' + d.customers.map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join('') + '</datalist>' +
    fld('Customer (pick or type)', 'f-cust', q.customer_name, 'text', ' list="custlist" autocomplete="off"') +
    fld('Address', 'f-addr', q.address) +
    '<div class="two2">' + fld('Contact person', 'f-person', q.contact_person) + fld('Contact number', 'f-cno', q.contact_no, 'tel') + '</div>' +
    '<h3 style="margin:14px 2px 8px">Items</h3><div id="f-lines">' +
    q.lines.map(function (l, i) {
      var sel = d.prices.findIndex(function (p) { return p.name === l.name && (p.code || '') === (l.code || '') && (p.size || '') === (l.size || ''); });
      return '<div class="qline" data-i="' + i + '"><button class="x" data-rm="' + i + '" aria-label="Remove">&times;</button>' +
        '<div class="fld"><label>Product</label><select data-f="prod" data-i="' + i + '"><option value="">Choose...</option>' +
        opts.replace('value="' + sel + '"', 'value="' + sel + '" selected') + '</select></div>' +
        '<div class="two2"><div class="fld"><label>Qty</label><input inputmode="decimal" data-f="qty" data-i="' + i + '" value="' + esc(l.qty) + '"></div>' +
        '<div class="fld"><label>Unit price</label><input inputmode="decimal" data-f="price" data-i="' + i + '" value="' + esc(l.price) + '"></div></div>' +
        '<div class="lt" id="lt-' + i + '">' + peso(Number(l.qty || 0) * Number(l.price || 0)) + '</div></div>';
    }).join('') + '</div><button class="btn ghost" id="f-add" style="margin-top:0">+ Add item</button>' +
    '<h3 style="margin:14px 2px 8px">Terms</h3>' +
    '<div class="fld"><label for="f-pay">Payment terms</label><select id="f-pay">' + PAYTERMS.map(function (t) {
      return '<option' + (t === q.payment_terms ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
    '<div class="two2">' + fld('Delivery terms', 'f-dlv', q.delivery_terms) + fld('Validity', 'f-valid', q.validity) + '</div>' +
    '<div class="two2">' + fld('Discount (total)', 'f-disc', q.discount, 'text', ' inputmode="decimal"') +
    fld('Delivery fee', 'f-fee', q.delivery_fee, 'text', ' inputmode="decimal"') + '</div>' +
    '<div class="two2">' + fld('VAT rate (%)', 'f-vat', num(Number(q.vat_rate) * 100), 'text', ' inputmode="decimal"') +
    fld('Sales agent', 'f-agent', q.agent) + '</div>' +
    fld('Notes', 'f-notes', q.notes) +
    '<div class="tot" id="f-tot"></div><div class="err" id="f-err"></div>' +
    '<button class="btn" id="f-save">Save quotation</button>' +
    '<button class="btn ghost" id="f-cancel">Cancel</button>';
  return html;
}
function readEditor() {
  var q = S.qf;
  q.customer_name = $('f-cust').value; q.address = $('f-addr').value; q.contact_person = $('f-person').value;
  q.contact_no = $('f-cno').value; q.payment_terms = $('f-pay').value; q.delivery_terms = $('f-dlv').value;
  q.validity = $('f-valid').value; q.discount = $('f-disc').value; q.delivery_fee = $('f-fee').value;
  q.vat_rate = $('f-vat').value === '' ? 0 : Number($('f-vat').value) / 100; q.agent = $('f-agent').value; q.notes = $('f-notes').value;
  Array.prototype.forEach.call(document.querySelectorAll('#f-lines [data-f=qty]'), function (e) { q.lines[e.dataset.i].qty = e.value; });
  Array.prototype.forEach.call(document.querySelectorAll('#f-lines [data-f=price]'), function (e) { q.lines[e.dataset.i].price = e.value; });
}
function paintTotals() {
  readEditor();
  var q = S.qf, t = qTotals(q, q.lines.filter(function (l) { return l.name; }));
  q.lines.forEach(function (l, i) { var e = $('lt-' + i); if (e) e.textContent = peso(Number(l.qty || 0) * Number(l.price || 0)); });
  $('f-tot').innerHTML = '<div><span>Subtotal</span><span>' + peso(t.sub) + '</span></div>' +
    '<div><span>VATable</span><span>' + peso(t.vatable) + '</span></div><div><span>VAT</span><span>' + peso(t.vat) + '</span></div>' +
    '<div class="g"><span>GRAND TOTAL</span><span>' + peso(t.grand) + '</span></div>';
}
function wireEditor() {
  var d = S.data, q = S.qf;
  $('f-cust').onchange = function () {
    var c = d.customers.find(function (x) { return x.name === $('f-cust').value; });
    q.customer_id = c ? c.id : '';
    if (c) { $('f-addr').value = c.address || ''; $('f-person').value = c.person || ''; $('f-cno').value = c.mobile || ''; }
  };
  Array.prototype.forEach.call(document.querySelectorAll('#f-lines select'), function (e) {
    e.onchange = function () {
      var p = d.prices[e.value], l = q.lines[e.dataset.i];
      if (!p) { l.name = ''; l.code = ''; l.size = ''; return; }
      l.name = p.name; l.code = p.code; l.size = p.size; l.vat = p.vat;
      var pe = document.querySelector('#f-lines [data-f=price][data-i="' + e.dataset.i + '"]');
      pe.value = p.price;
      var qe = document.querySelector('#f-lines [data-f=qty][data-i="' + e.dataset.i + '"]');
      if (!qe.value) qe.value = 1;
      paintTotals();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#f-lines input, #f-disc, #f-fee, #f-vat'), function (e) {
    e.oninput = paintTotals;
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function (b) {
    b.onclick = function () { readEditor(); q.lines.splice(Number(b.dataset.rm), 1);
      if (!q.lines.length) q.lines.push({code: '', name: '', size: '', vat: '', qty: '', price: ''}); draw(); };
  });
  $('f-add').onclick = function () { readEditor(); q.lines.push({code: '', name: '', size: '', vat: '', qty: '', price: ''}); draw(); };
  $('f-cancel').onclick = function () { var id = q.id; S.qf = null; id ? go('quotes', String(id)) : go('quotes'); };
  $('f-save').onclick = async function () {
    readEditor();
    var err = $('f-err');
    if (!q.customer_name.trim()) { err.textContent = 'Choose or type the customer name.'; return; }
    var lines = q.lines.filter(function (l) { return l.name && Number(l.qty) > 0; });
    if (!lines.length) { err.textContent = 'Add at least one item with a quantity.'; return; }
    var bad = q.lines.some(function (l) { return l.name && (isNaN(Number(l.qty)) || isNaN(Number(l.price)) || Number(l.price) < 0); });
    if (bad || isNaN(Number(q.discount || 0)) || isNaN(Number(q.delivery_fee || 0)) || isNaN(q.vat_rate)) {
      err.textContent = 'A quantity, price or amount is not a number.'; return;
    }
    $('f-save').disabled = true; err.textContent = 'Saving...';
    var body = JSON.parse(JSON.stringify(q));
    body.lines = lines.map(function (l) { return {code: l.code, name: l.name, size: l.size, vat: l.vat, qty: Number(l.qty), price: Number(l.price)}; });
    body.discount = Number(q.discount || 0); body.delivery_fee = Number(q.delivery_fee || 0);
    try {
      var r = await rpc('goos_m_quote', {p_token: S.token, p_action: 'save', p_data: JSON.stringify(body)});
      if (r.error === 'signin') { S.token = ''; save(); drawLogin('Please sign in again.'); return; }
      if (!r.ok) { err.textContent = r.error; $('f-save').disabled = false; return; }
      S.qf = null; go('quotes', String(r.id));
    } catch (e) {
      err.textContent = 'Could not reach GOOS - nothing was saved. Check the internet and try again.';
      $('f-save').disabled = false;
    }
  };
  paintTotals();
}

/* -------------------------------------------------------------- payments */
function defaultAccount(accts, method) {
  var m = String(method || '').toLowerCase();
  if (/cod|cash/.test(m)) {
    var h = accts.find(function (a) { return /on hand/i.test(a[1]) || /^cash$/i.test(String(a[1]).trim()); });
    if (h) return h[0];
  }
  var b = accts.find(function (a) { return /bank/i.test(a[1]) && !/equivalent/i.test(a[1]); });
  return (b || accts[0] || [''])[0];
}
function payScreen(d) {
  var o = d.order;
  if (!o) return '<div class="empty">That order is no longer there.</div>';
  var pend = Number(d.pending || 0), owed = Math.round((Number(o.total) - Number(o.paid) - pend) * 100) / 100;
  var accts = d.accounts || [];
  var html = '<div class="sum">' + esc(o.customer_name) + '<br><b>' + peso(Math.max(owed, 0)) + '</b> still owed<br><span style="font-size:13px">' +
    esc(o.reference) + ' &middot; total ' + peso(o.total) + ' &middot; paid ' + peso(o.paid) + '</span></div>';
  if (pend > 0) html += '<div class="banner warn">' + peso(pend) + ' recorded on a phone is waiting to be posted.</div>';
  if (!d.laptops) html += '<div class="banner warn">No GOOS laptop is open right now. The payment is kept safely and posted as soon as one opens.</div>';
  if (o.state !== 'dispatched' && o.state !== 'recorded') return html + '<div class="empty">Only delivered orders take payments.</div>';
  if (owed <= 0.009) return html + '<div class="empty">Nothing left to collect on this order.</div>';
  if (!accts.length) return html + '<div class="empty">Open GOOS on a laptop once so the phone learns where payments can go, then press Refresh.</div>';
  var def = o.paid_to || defaultAccount(accts, o.payment_method);
  return html +
    fld('Amount received', 'p-amt', owed.toFixed(2), 'text', ' inputmode="decimal"') +
    fld('Date received', 'p-date', d.today, 'date', ' max="' + esc(d.today) + '"') +
    '<div class="fld"><label for="p-acct">Received into</label><select id="p-acct">' + accts.map(function (a) {
      return '<option value="' + esc(a[0]) + '"' + (a[0] === def ? ' selected' : '') + '>' + esc(a[0] + ' - ' + a[1]) + '</option>'; }).join('') + '</select></div>' +
    fld('Reference (OR no., GCash or bank ref) - optional', 'p-ref', '') +
    '<h3 style="margin:14px 2px 6px">Withheld by the customer (BIR 2307)</h3>' +
    '<div class="fld"><label for="p-rate">Rate withheld</label><select id="p-rate">' +
    '<option value="0">None</option><option value="0.01">1% - goods (WC158)</option>' +
    '<option value="0.02">2% - services (WC160)</option></select></div>' +
    '<div class="two2">' + fld('Tax withheld', 'p-cwt', '', 'text', ' inputmode="decimal"') +
    fld('2307 no. (optional)', 'p-cert', '') + '</div>' +
    '<p class="stamp" id="p-sum"></p>' +
    '<div class="err" id="p-err"></div><button class="btn" id="p-go">Record payment</button>' +
    '<p class="stamp">A part payment is fine - the balance stays on the Collections list until it is settled.</p>';
}
function wirePay() {
  var b = $('p-go'); if (!b) return;
  var o = S.data.order, d = S.data;
  var owed = Math.round((Number(o.total) - Number(o.paid) - Number(d.pending || 0)) * 100) / 100;
  var vr = Number(d.vat_rate == null ? 0.12 : d.vat_rate);
  function sum() {
    var a = Number($('p-amt').value || 0), t = Number($('p-cwt').value || 0);
    $('p-sum').textContent = t > 0 ? 'Settles ' + peso(a + t) + ' of the invoice: ' + peso(a) + ' cash + ' + peso(t) + ' tax withheld.' : '';
  }
  $('p-rate').onchange = function () {
    var r = Number($('p-rate').value);
    if (!r) { $('p-cwt').value = ''; $('p-amt').value = owed.toFixed(2); sum(); return; }
    /* the tax is on the amount net of VAT, the cash is the rest */
    var base = vr ? Math.round(owed / (1 + vr) * 100) / 100 : owed;
    var tax = Math.round(base * r * 100) / 100;
    $('p-cwt').value = tax.toFixed(2); $('p-amt').value = (owed - tax).toFixed(2); sum();
  };
  $('p-amt').oninput = sum; $('p-cwt').oninput = sum;
  b.onclick = async function () {
    var amt = Number($('p-amt').value || 0), tax = Number($('p-cwt').value || 0), err = $('p-err');
    if (isNaN(amt) || isNaN(tax) || amt < 0 || tax < 0 || !(amt + tax > 0)) { err.textContent = 'Enter the amount received.'; return; }
    if (!confirm('Record ' + peso(amt) + (tax > 0 ? ' + ' + peso(tax) + ' withheld (2307)' : '') + ' from ' +
                 o.customer_name + ' (' + o.reference + ')?')) return;
    b.disabled = true; err.textContent = 'Saving...';
    try {
      var r = await rpc('goos_m_pay', {p_token: S.token, p_order: String(o.id), p_amount: String(amt),
        p_date: $('p-date').value, p_account: $('p-acct').value, p_ref: $('p-ref').value,
        p_cwt: String(tax), p_rate: $('p-rate').value, p_cert: $('p-cert').value});
      if (r.error === 'signin') { S.token = ''; save(); drawLogin('Please sign in again.'); return; }
      if (!r.ok) { err.textContent = r.error; b.disabled = false; return; }
      S.poll = 24; await go('collections', 'mine'); schedulePoll();
    } catch (e) {
      err.textContent = 'Could not reach GOOS - nothing was recorded. Check the internet and try again.';
      b.disabled = false;
    }
  };
}
function myPayments(d) {
  if (!d.length) return '<div class="empty">You have not recorded any payments on the phone yet.</div>';
  return '<div class="list">' + d.map(function (x) {
    var st = DSTAT[x.status] || [x.status, ''];
    return '<div class="row"><div class="t"><span>' + esc(x.customer_name || '') + ' &middot; ' + peso(x.amount) +
      (Number(x.cwt) > 0 ? ' + ' + peso(x.cwt) + ' 2307' : '') +
      '</span><span class="pill ' + st[1] + '">' + esc(st[0]) + '</span></div><div class="s"><span>' + esc(x.reference || '') +
      (x.ref ? ' &middot; ref ' + esc(x.ref) : '') + ' &middot; ' + esc(x.paid_on) + '</span><span>' + esc(x.at) + '</span></div>' +
      (x.result ? '<div class="s"><span>' + esc(x.result) + '</span></div>' : '') + '</div>';
  }).join('') + '</div>';
}

/* ------------------------------------------------------------------ start */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
load();
if (S.token) go('dashboard'); else drawLogin('');
// Coming back to the app after a while opens on the Dashboard again.
var hiddenAt = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (S.token && hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000 && !S.arg) go('dashboard');
});
</script>
