/* ================================================================

:root { --navy: #0E1A33; --gold: #18B6D8; --ground: #EDF2F8; --ink: #0F1B2D; --muted: #55657E;

  --cyan: #18B6D8; --violet: #6D5BFF; --amber: #E39A12; --edge: #B9C7DA; --panel: #FFFFFF; }
body { background-color: var(--ground);
  background-image: linear-gradient(rgba(46,91,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(46,91,255,.045) 1px, transparent 1px);
  background-size: 28px 28px; font-feature-settings: "tnum" 1; }
/* sidebar: a dark console */
.side { background: linear-gradient(180deg, #0B1426 0%, #111D36 100%); border-right: 1px solid #22345A; }
.brand { letter-spacing: 2px; }
.brand small { letter-spacing: 1.5px; text-transform: uppercase; font-size: 10px; color: #7FD8EC; }
.rule { height: 1px; background: linear-gradient(90deg, var(--cyan), rgba(24,182,216,0)); }
.nav { border-radius: 8px; color: #C6D2E6; }
.nav:hover { background: rgba(24,182,216,.10); }
.nav.on { background: linear-gradient(90deg, rgba(24,182,216,.22), rgba(24,182,216,.04)); color: #fff; box-shadow: inset 3px 0 0 var(--cyan); }
.nav .n { background: var(--cyan); color: #04121F; }
.nav { display: block; width: 100%; }
.nav > span:first-child { display: inline-block; width: 18px; margin-right: 8px; text-align: center; }
.nav .n { float: right; margin-left: 8px; }
.shead { font-size: 10.5px; letter-spacing: .8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shead > span:not(.car):not(.cnt) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.me { border-top-color: #22345A; }
.me button { border-color: #2A4170; border-radius: 8px; }
.me button:hover { background: rgba(24,182,216,.12); }
/* headings: HUD style */
.crumb { text-transform: uppercase; letter-spacing: 1.4px; font-size: 11px; font-weight: 600; color: #3E6FA8; }
h1 { color: var(--navy); letter-spacing: .2px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: #22385E; display: flex; align-items: center; gap: 8px; }

.drawer h1 { font-size: 22px; }
/* panels with a lit edge */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 0 rgba(15,27,45,.04), 0 6px 18px -12px rgba(30,60,120,.35); }

.kpis > .kpi:nth-child(4n+2) { border-top-color: var(--violet); }

.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }

.fl { font-weight: 500; }
.fl textarea { padding: 9px 11px; border: 1px solid var(--edge); color: var(--ink); font: inherit; }
/* drawer = a side console */
.drawer-bg { background: rgba(11,20,38,.45); }
.drawer { border-left: 4px solid var(--cyan); box-shadow: -18px 0 40px -20px rgba(11,20,38,.55); }
/* order board */
.col { background: #E4EBF5; border: 1px solid var(--line); border-radius: 12px; }
.ocard { border-radius: 10px; border-color: var(--line); box-shadow: 0 1px 0 rgba(15,27,45,.04); }
.ocard:hover { border-color: var(--blue); }
/* login: the start screen */
.login-wrap { background: radial-gradient(circle at 30% 20%, #1B2F5C 0%, #0B1426 60%);

  background-size: 32px 32px, 32px 32px, 100% 100%; }
.login { border-radius: 14px; border-top: 4px solid var(--cyan); box-shadow: 0 20px 60px -20px rgba(0,0,0,.6); }

   its last column (the Pay button) under the panel's edge: it fits the
   panel, and only a genuinely wide table scrolls inside it */
.card table { min-width: min(520px, 100%); }

.top > .btns { flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 1100px) { .top { align-items: flex-start; } .top > .btns { justify-content: flex-start; width: 100%; } }
a.golink{color:#2E5BFF;font-weight:600;text-decoration:none}a.golink:hover{text-decoration:underline}
</style>

  if (isNaN(d)) return s || '-';

  if (n === 0) return 'Today'; if (n === -1) return 'Tomorrow'; if (n === 1) return 'Yesterday';

function drawer(loader) {
  var bg = document.createElement('div'); bg.className = 'drawer-bg';
  bg.innerHTML = '<div class="drawer"><div class="empty">Loading...</div></div>';
  bg.onclick = function (e) { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
  var dr = bg.firstChild, close = function () { bg.remove(); };
  Promise.resolve().then(function () { return loader(dr, close); }).catch(function (e) {
    if (e.message === 'signin') { close(); return; }
    dr.innerHTML = '<div class="alert">' + esc(e.message || 'Could not reach GOOS.') + '</div><div><button class="btn" id="dx">Close</button></div>';
    $('dx').onclick = close;
  });
}
function fld(label, id, val, type, extra) {
  return '<label class="fl"><span>' + esc(label) + '</span><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(val == null ? '' : val) + '"' + (extra || '') + '></label>';
}
function laptopsNote(n) {
  return n ? '' : '<div class="alert">No GOOS laptop is open right now. What you send is kept safely and carried out as soon as one opens.</div>';
}

/* ---------------------------------------------------------------- payments */
/* Payments go through the SAME server functions as the phone (goos_m_pay,
   goos_m_paybatch): they are queued, and an open GOOS laptop posts them with
   the desktop's own collection rules, journal included. Nothing is posted by
   this page itself. */
function defaultAccount(accts, method) {
  var m = String(method || '').toLowerCase();
  if (/cash|cod/.test(m)) { var c = accts.find(function (a) { return /cash on hand|petty/i.test(a[1]); }); if (c) return c[0]; }
  if (/gcash|maya/.test(m)) { var g = accts.find(function (a) { return /gcash|maya|e-?wallet/i.test(a[1]); }); if (g) return g[0]; }
  var b = accts.find(function (a) { return /bank/i.test(a[1]) && !/equivalent/i.test(a[1]); });
  return (b || accts[0] || [''])[0];
}
function payTax(owed, rate, vr) {
  if (!rate) return 0;
  var base = vr ? Math.round(owed / (1 + vr) * 100) / 100 : owed;
  return Math.round(base * rate * 100) / 100;
}
/* oldest first, the last one part-paid if the money runs out - the same rule
   as GOOS on the laptop and the phone */
function batchAlloc(list, cash, rate, vr) {
  var left = Math.round(cash * 100) / 100, out = [];
  var k = 1 - (vr ? rate / (1 + vr) : rate);
  list.forEach(function (x) {
    var owed = Number(x.bal);
    if (left <= 0.004 || owed <= 0) return;
    var tax = payTax(owed, rate, vr), need = Math.round((owed - tax) * 100) / 100;
    if (left + 0.004 >= need) { out.push({id: x.id, cash: need, cwt: tax, full: true}); left = Math.round((left - need) * 100) / 100; }
    else { var settle = k > 0 ? Math.round(left / k * 100) / 100 : left;
           out.push({id: x.id, cash: left, cwt: rate ? Math.round((settle - left) * 100) / 100 : 0, full: false}); left = 0; }
  });
  return {parts: out, left: Math.round(left * 100) / 100};
}
function openPay(custId, onlyOrder) {
  drawer(async function (dr, close) {
    var d = await data('collections', 'batch:' + custId);
    var rs = d.rows || [], accts = d.accounts || [], vr = Number(d.vat_rate == null ? 0.12 : d.vat_rate);
    var name = (d.customer || {}).trade_name || 'Customer';
    var top = '<div class="row"><div><div class="crumb">Record payment</div><h1 style="font-size:22px">' + esc(name) + '</h1></div><button class="btn" id="dx">Close</button></div>' + laptopsNote(d.laptops);
    if (!rs.length) { dr.innerHTML = top + '<div class="empty">Nothing left to collect from this customer (payments already waiting to post are counted).</div>'; $('dx').onclick = close; return; }
    if (!accts.length) { dr.innerHTML = top + '<div class="empty">Open GOOS on a laptop once so the web learns where payments can go, then try again.</div>'; $('dx').onclick = close; return; }
    var def = (rs[0] && rs[0].paid_to) || defaultAccount(accts, rs[0] && rs[0].payment_method);
    dr.innerHTML = top + '<div class="mut">Tick the invoices this payment is for. It settles them oldest first.</div>' +
      '<table><tr><th></th><th>Invoice</th><th>Date</th><th class="n">Balance</th><th class="n"></th></tr>' + rs.map(function (x) {
        var on = !onlyOrder || String(x.id) === String(onlyOrder);
        return '<tr><td><input type="checkbox" class="b-ck" value="' + x.id + '"' + (on ? ' checked' : '') + '></td><td>' + esc(x.si_no ? 'SI ' + x.si_no : x.reference) +
          (x.dr_no ? '<br><span class="mut">DR ' + esc(x.dr_no) + '</span>' : '') + '</td><td>' + esc(day(x.day)) + '<br><span class="mut">' + x.age + ' days</span></td>' +
          '<td class="n"><b>' + money(x.bal) + '</b></td><td class="n"><span id="b-a' + x.id + '"></span></td></tr>'; }).join('') + '</table>' +
      '<div class="form">' + fld('Amount received', 'b-amt', '', 'text', ' inputmode="decimal"') +
      fld('Date received', 'b-date', d.today, 'date', ' max="' + esc(d.today) + '"') +
      '<label class="fl"><span>Received into</span><select id="b-acct">' + accts.map(function (a) {
        return '<option value="' + esc(a[0]) + '"' + (a[0] === def ? ' selected' : '') + '>' + esc(a[0] + ' - ' + a[1]) + '</option>'; }).join('') + '</select></label>' +
      fld('Reference (OR, deposit, check, GCash or bank ref) - optional', 'b-ref', '') +
      '<label class="fl"><span>Tax withheld by the customer (BIR 2307)</span><select id="b-rate"><option value="0">None</option>' +
      '<option value="0.01">1% - goods (WC158)</option><option value="0.02">2% - services (WC160)</option></select></label>' +
      fld('2307 no. (optional, one invoice only)', 'b-cert', '') + '</div>' +
      '<div class="mut" id="b-sum"></div><div class="err" id="b-err"></div>' +
      '<div class="btns"><button class="btn dark" id="b-go">Record payment</button></div>' +
      '<div class="mut">A part payment is fine - the balance stays open until it is settled. An open GOOS laptop posts it within a minute.</div>';
    $('dx').onclick = close;
    var typed = false, cur = null;
    function ticked() {
      var on = {}; dr.querySelectorAll('.b-ck').forEach(function (c) { if (c.checked) on[c.value] = 1; });
      return rs.filter(function (x) { return on[String(x.id)]; });
    }
    function upd() {
      var list = ticked(), rate = Number($('b-rate').value);
      if (!typed) $('b-amt').value = list.length ? list.reduce(function (a, x) { return a + Number(x.bal) - payTax(Number(x.bal), rate, vr); }, 0).toFixed(2) : '';
      cur = batchAlloc(list, Number($('b-amt').value || 0), rate, vr);
      var got = {}; cur.parts.forEach(function (p) { got[p.id] = p; });
      rs.forEach(function (x) { var el = $('b-a' + x.id), p = got[x.id]; if (!el) return;
        el.textContent = p ? (p.full ? 'paid in full' : 'part: ' + money(p.cash + p.cwt)) : ''; el.className = p ? (p.full ? 'pill g' : 'pill o') : ''; });
      var cash = cur.parts.reduce(function (a, p) { return a + p.cash; }, 0), tax = cur.parts.reduce(function (a, p) { return a + p.cwt; }, 0);
      $('b-sum').textContent = list.length + ' ticked. ' + money(cash) + ' cash' + (tax > 0 ? ' + ' + money(tax) + ' withheld' : '') + ' over ' + cur.parts.length + ' invoice(s).' +
        (cur.left > 0.009 ? ' ' + money(cur.left) + ' is MORE than the ticked invoices need.' : '');
    }
    dr.querySelectorAll('.b-ck').forEach(function (c) { c.onchange = function () { typed = false; upd(); }; });
    $('b-amt').oninput = function () { typed = true; upd(); };
    $('b-rate').onchange = function () { typed = false; upd(); };
    upd();
    $('b-go').onclick = async function () {
      upd();
      var err = $('b-err'), b = $('b-go');
      if (!cur || !cur.parts.length) { err.textContent = 'Tick the invoices and enter the amount received.'; return; }
      if (cur.left > 0.009) { err.textContent = 'The amount is ' + money(cur.left) + ' more than the ticked invoices need. Tick more or lower the amount.'; return; }
      var cash = cur.parts.reduce(function (a, p) { return a + p.cash; }, 0);
      if (!confirm('Record ' + money(cash) + ' from ' + name + ' against ' + cur.parts.length + ' invoice(s)?')) return;
      b.disabled = true; err.textContent = 'Saving...';
      try {
        var r;
        if (cur.parts.length === 1) {
          var p = cur.parts[0];
          r = await rpc('goos_m_pay', {p_token: S.token, p_order: String(p.id), p_amount: p.cash.toFixed(2), p_date: $('b-date').value,
            p_account: $('b-acct').value, p_ref: $('b-ref').value, p_cwt: p.cwt.toFixed(2), p_rate: $('b-rate').value, p_cert: $('b-cert').value});
        } else {
          r = await rpc('goos_m_paybatch', {p_token: S.token,
            p_orders: cur.parts.map(function (p) { return String(p.id); }).join(','),
            p_amounts: cur.parts.map(function (p) { return p.cash.toFixed(2); }).join(','),
            p_cwts: cur.parts.map(function (p) { return p.cwt.toFixed(2); }).join(','),
            p_date: $('b-date').value, p_account: $('b-acct').value, p_ref: $('b-ref').value, p_rate: $('b-rate').value});
        }
        if (r.error === 'signin') { close(); S.token = ''; save(); drawLogin('Please sign in again.'); return; }
        if (!r.ok) { err.textContent = r.error; b.disabled = false; return; }
      } catch (e) { err.textContent = 'Could not reach GOOS - nothing was recorded. Check the internet and try again.'; b.disabled = false; return; }
      dr.innerHTML = '<h1 style="font-size:22px">Payment sent</h1><div class="ok">' + money(cash) + ' from ' + esc(name) + ' is queued. An open GOOS laptop posts it within a minute; the balance then updates here.</div>' +
        '<div><button class="btn dark" id="dx">Done</button></div>';
      $('dx').onclick = function () { close(); go(V.page, V.arg); };
    };
  });
}

/* ---------------------------------------------------------------- approvals */
var ACTW = {approve: 'Approve', reject: 'Reject'};
async function pageApprovals() {
  var d = await data('approvals'), items = d.items || [], decs = d.decisions || [];
  V.sel = V.sel || {};
  var can_ = !!d.can_sign;
  var rows = items.map(function (x) {
    var k = x.kind + ':' + x.id, blocked = x.sent || x.mine || (x.kind === 'dispatch' && !d.ceo);
    var why = x.sent ? '<span class="pill">Sent - being carried out</span>' : (x.mine ? '<span class="pill y">Your own - someone else signs</span>' :
      (x.kind === 'dispatch' && !d.ceo ? '<span class="pill y">CEO signs</span>' : ''));
    var prev = x.lines ? '<div class="mut" style="white-space:pre-wrap;margin-top:6px">' + esc(x.lines) + '</div>' : '';
    var prob = x.problems ? '<div class="pill r" style="display:inline-block;margin-top:6px;white-space:normal">' + esc(x.problems) + '</div>' : '';
    return '<tr><td>' + (can_ && !blocked ? '<input type="checkbox" class="a-ck" value="' + esc(k) + '"' + (V.sel[k] ? ' checked' : '') + '>' : '') + '</td>' +
      '<td><b>' + esc(x.label) + '</b><br><span class="mut">' + esc(day(x.at)) + (x.who ? ' \u00b7 ' + esc(x.who) : '') + '</span></td>' +
      '<td><b>' + esc(x.what) + '</b><br>' + esc(x.detail) + (x.remarks ? '<br><span class="mut">' + esc(x.remarks) + '</span>' : '') + prev + prob + '</td><td class="n">' + why + '</td></tr>';
  }).join('');
  var decH = decs.map(function (m) {
    var cls = m.status === 'done' ? 'g' : (m.status === 'failed' ? 'r' : 'o');
    return '<li><span>' + esc(m.at) + ' \u00b7 ' + esc(m.action) + ' ' + esc(m.kind) + ' #' + esc(m.ref_id) + (m.result ? '<br><span class="mut">' + esc(String(m.result).slice(0, 160)) + '</span>' : '') +
      '</span><span class="pill ' + cls + '">' + esc(m.status) + '</span></li>'; }).join('');
  $('main').innerHTML = head('Approvals', 'For approval', can_ ? '<button class="btn" id="a-all">Tick all</button><button class="btn" id="a-rej">Reject ticked</button><button class="btn dark" id="a-ok">Approve ticked</button>' : '') +
    laptopsNote(d.laptops) + (can_ ? '' : '<div class="ok">You can see what is waiting. Signing is for the CEO and QA.</div>') +
    '<div class="card">' + (items.length ? '<table><tr><th></th><th>What</th><th>Details</th><th></th></tr>' + rows + '</table>' : '<div class="empty">Nothing is waiting for approval.</div>') + '</div>' +
    (decH ? '<div class="card"><h2>Your recent decisions</h2><ul class="list">' + decH + '</ul></div>' : '');
  document.querySelectorAll('.a-ck').forEach(function (c) { c.onchange = function () { if (c.checked) V.sel[c.value] = 1; else delete V.sel[c.value]; }; });
  if (!can_) return;
  $('a-all').onclick = function () { document.querySelectorAll('.a-ck').forEach(function (c) { c.checked = true; V.sel[c.value] = 1; }); };
  $('a-ok').onclick = function () { openSign('approve'); };
  $('a-rej').onclick = function () { openSign('reject'); };
  if (decs.some(function (m) { return m.status === 'queued' || m.status === 'working'; })) {
    clearTimeout(V.poll); V.poll = setTimeout(function () { if (V.page === 'approvals' && !document.querySelector('.drawer-bg')) go('approvals', ''); }, 8000);
  }
}
function openSign(action) {
  var keys = Object.keys(V.sel || {});
  if (!keys.length) { alert('Tick the items first.'); return; }
  drawer(function (dr, close) {
    var pos = ''; try { pos = localStorage.getItem('goos_position') || ''; } catch (e) {}
    dr.innerHTML = '<div class="row"><h1 style="font-size:22px">' + ACTW[action] + ' ' + keys.length + ' item(s)</h1><button class="btn" id="dx">Close</button></div>' +
      '<div class="mut">' + (action === 'approve' ? 'Signing carries these out exactly as For Approval on the laptop does. Anything that can no longer be done stays waiting, and you will see why.'
        : 'Nothing changes in stock. Each stays on record as Rejected, with your reason.') + '</div><div class="form">' +
      (action === 'reject' ? fld('Reason (required)', 'sg-note', '') : fld('Note (optional)', 'sg-note', '')) +
      fld('Your full name', 'sg-name', '', 'text', ' autocomplete="name"') + fld('Your position', 'sg-pos', pos) +
      fld('Your GOOS password', 'sg-pw', '', 'password', ' autocomplete="current-password"') + '</div>' +
      '<div class="err" id="sg-err"></div><div class="btns"><button class="btn dark" id="sg-go">Sign and ' + action + '</button></div>';
    $('dx').onclick = close;
    $('sg-go').onclick = async function () {
      var name = $('sg-name').value.trim(), p = $('sg-pos').value.trim(), pw = $('sg-pw').value, note = $('sg-note').value.trim(), err = $('sg-err');
      if (!name || p.length < 2 || !pw) { err.textContent = 'Type your full name, your position and your password to sign.'; return; }
      if (action === 'reject' && !note) { err.textContent = 'Type the reason for rejecting.'; return; }
      $('sg-go').disabled = true; err.textContent = 'Signing...';
      var byKind = {}; keys.forEach(function (k) { var q = k.split(':'); (byKind[q[0]] = byKind[q[0]] || []).push(q[1]); });
      var queued = 0, skipped = [], fail = '';
      try {
        var salt = await rpc('goos_m_salt', {p_user: S.user});
        var h = await pbkdf2Hex(pw, String(salt));
        for (var kind in byKind) {
          var r = await rpc('goos_m_decide', {p_token: S.token, p_kind: kind, p_ids: byKind[kind].join(','), p_action: action,
                                              p_name: name, p_position: p, p_hash: h, p_note: note});
          if (!r.ok) { if (r.error === 'signin') { close(); S.token = ''; save(); drawLogin('Please sign in again.'); return; } fail = r.error; break; }
          queued += r.queued || 0; skipped = skipped.concat(r.skipped || []);
        }
      } catch (e) { fail = 'Could not reach GOOS. Check the internet and try again.'; }
      if (fail && !queued) { err.textContent = fail; $('sg-go').disabled = false; return; }
      try { localStorage.setItem('goos_position', p); } catch (e) {}
      V.sel = {};
      dr.innerHTML = '<h1 style="font-size:22px">' + (queued ? 'Signed' : 'Nothing signed') + '</h1><div class="ok">' + queued + ' item(s) sent. A GOOS laptop carries them out within a minute - watch "Your recent decisions".</div>' +
        (skipped.length ? '<div class="alert">Not sent:<br>' + skipped.map(esc).join('<br>') + '</div>' : '') + (fail ? '<div class="alert">' + esc(fail) + '</div>' : '') +
        '<div><button class="btn dark" id="dx">OK</button></div>';
      $('dx').onclick = function () { close(); go('approvals', ''); };
    };
  });
}

/* ---------------------------------------------------------------- order actions */
/* New, confirm, dispatch and cancel are QUEUED (goos_m_order) and carried
   out by an open GOOS laptop with the desktop's own order functions - stock,
   LOTs (FEFO), toll and dispatch rules stay in one place. */
async function ordr(action, id, payload) {
  var r = await rpc('goos_m_order', {p_token: S.token, p_action: action, p_id: String(id || ''),
                                     p_data: payload ? JSON.stringify(payload) : ''});
  if (r && r.error === 'signin') { S.token = ''; save(); drawLogin('Please sign in again.'); throw new Error('signin'); }
  if (!r || !r.ok) throw new Error((r && r.error) || 'GOOS could not do this.');
  return r;
}
function sentNote(dr, close, what) {
  dr.innerHTML = '<h1 style="font-size:22px">Sent</h1><div class="ok">' + esc(what) +
    ' An open GOOS laptop carries it out within a minute; the result shows under "Your order requests" on the Orders page.</div>' +
    '<div><button class="btn dark" id="dx">OK</button></div>';
  $('dx').onclick = function () { close(); go('orders', V.arg); };
}
function tomorrow() { var d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }

function openNewOrder() {
  drawer(async function (dr, close) {
    var f = await ordr('form');
    var items = f.items || [], custs = f.customers || [];
    var byName = {}; items.forEach(function (i) { byName[i.name.toLowerCase()] = i; });
    var opts = items.map(function (i) { return '<option value="' + esc(i.name) + '">'; }).join('');
    dr.innerHTML = '<div class="row"><div><div class="crumb">Orders</div><h1 style="font-size:22px">New Order</h1></div><button class="btn" id="dx">Close</button></div>' +
      laptopsNote(f.laptops) + '<div class="form">' +
      '<label class="fl" style="grid-column:1/-1"><span>Customer</span><select id="n-cust"><option value="">- pick the customer -</option>' +
      custs.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select></label>' +
      '<div id="n-note" class="mut" style="grid-column:1/-1"></div>' +
      fld('Delivery date', 'n-date', tomorrow(), 'date') + fld('Preferred time', 'n-time', '') +
      fld('Dispatch day', 'n-day', '') +
      '<label class="fl"><span>Required receipts</span><select id="n-docs"><option value="">None</option><option>DR</option><option>SI</option><option>SI &amp; DR</option></select></label>' +
      '<label class="fl" style="grid-column:1/-1"><span>Notes</span><input id="n-notes"></label></div>' +
      '<datalist id="n-items">' + opts + '</datalist>' +
      '<h2 style="margin-top:6px">Items</h2><div class="mut">The price comes from Pricing; type over it if this order\'s price differs.</div>' +
      '<table id="n-lines"><tr><th>Item</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Amount</th><th></th></tr></table>' +
      '<div class="btns"><button class="btn" id="n-add">+ Add item</button><span style="margin-left:auto;font-weight:700" id="n-total"></span></div>' +
      '<div class="err" id="n-err"></div><div class="btns"><button class="btn dark" id="n-go">Save Order</button></div>' +
      '<div class="mut">Stock is checked and the LOTs to send are chosen (oldest expiry first) when a GOOS laptop saves it, exactly as on the desktop.</div>';
    $('dx').onclick = close;
    var tbl = $('n-lines');
    function total() {
      var t = 0;
      tbl.querySelectorAll('tr.ln').forEach(function (tr) {
        var a = Number(tr.querySelector('.q').value || 0) * Number(tr.querySelector('.p').value || 0);
        tr.querySelector('.a').textContent = a ? money(a) : ''; t += a; });
      $('n-total').textContent = 'Order total ' + money(t);
    }
    function addLine() {
      var tr = document.createElement('tr'); tr.className = 'ln';
      tr.innerHTML = '<td><input class="i search" list="n-items" style="min-width:260px" placeholder="Type to search"></td>' +
        '<td class="n"><input class="q search" style="min-width:0;width:80px" inputmode="decimal"></td>' +
        '<td class="n"><input class="p search" style="min-width:0;width:110px" inputmode="decimal"></td><td class="n a"></td>' +
        '<td class="n"><button class="btn sm x">\u00d7</button></td>';
      tbl.appendChild(tr);
      tr.querySelector('.i').onchange = function () { var it = byName[this.value.trim().toLowerCase()]; if (it) tr.querySelector('.p').value = Number(it.price).toFixed(2); total(); };
      tr.querySelector('.q').oninput = total; tr.querySelector('.p').oninput = total;
      tr.querySelector('.x').onclick = function () { tr.remove(); total(); };
      tr.querySelector('.i').focus();
    }
    $('n-add').onclick = addLine; addLine(); total();
    $('n-cust').onchange = function () {
      var c = custs.filter(function (x) { return String(x.id) === $('n-cust').value; })[0];
      $('n-note').innerHTML = c && c.note ? '<span class="pill o" style="white-space:normal;display:inline-block">' + esc(c.note) + '</span>' : '';
      if (c) { $('n-day').value = c.day || ''; $('n-docs').value = c.docs || '';
               if (c.note && $('n-notes').value.indexOf(c.note) < 0) $('n-notes').value = c.note; }
    };
    $('n-go').onclick = async function () {
      var err = $('n-err'), lines = [], bad = '';
      if (!$('n-cust').value) { err.textContent = 'Pick the customer.'; return; }
      tbl.querySelectorAll('tr.ln').forEach(function (tr) {
        var nm = tr.querySelector('.i').value.trim(), q = Number(tr.querySelector('.q').value || 0), p = Number(tr.querySelector('.p').value || 0);
        if (!nm && !q) return;
        if (!byName[nm.toLowerCase()]) { bad = nm + ' is not an item in Pricing - pick it from the list.'; return; }
        if (!(q > 0)) { bad = 'Enter the quantity for ' + nm + '.'; return; }
        if (isNaN(p) || p < 0) { bad = 'Check the price of ' + nm + '.'; return; }
        lines.push({name: byName[nm.toLowerCase()].name, qty: q, price: p});
      });
      if (bad) { err.textContent = bad; return; }
      if (!lines.length) { err.textContent = 'Add at least one item.'; return; }
      $('n-go').disabled = true; err.textContent = 'Sending...';
      try {
        await ordr('new', '', {customer_id: Number($('n-cust').value), delivery_date: $('n-date').value, time: $('n-time').value,

function barsSvg(months, key, color) {
  var w = 640, h = 190, pad = 34, n = months.length || 1, vals = months.map(function (m) { return Number(m[key] || 0); });
  var mx = Math.max.apply(null, vals.concat([0])), mn = Math.min.apply(null, vals.concat([0])), span = (mx - mn) || 1;
  var y0 = pad / 2 + (h - pad) * (mx / span), bw = (w - 20) / n * 0.62;
  var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:820px;height:auto;display:block;margin:8px auto 0" role="img"><line x1="10" x2="' + (w - 10) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="#D5D3CA"/>';
  months.forEach(function (m, i) {
    var v = Number(m[key] || 0), x = 10 + (w - 20) / n * i + ((w - 20) / n - bw) / 2, bh = Math.abs(v) / span * (h - pad);
    if (v) out += '<rect x="' + x.toFixed(1) + '" y="' + (v >= 0 ? y0 - bh : y0).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh, 1).toFixed(1) + '" rx="4" fill="' + (v < 0 ? '#B4501A' : color) + '"><title>' + esc(m.month) + ': ' + money0(v) + '</title></rect>';
    out += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 4) + '" font-size="11" text-anchor="middle" fill="#5B6273">' + esc(m.month.slice(5)) + '</text>';
  });
  return out + '</svg>';
}

   nothing, so they are saved straight away (goos_m_quote, the phone's same

function quoteTotals(q, lines) {
  var sub = lines.reduce(function (s, l) { return s + Number(l.qty || 0) * Number(l.price || 0); }, 0);
  var total = sub - Number(q.discount || 0) + Number(q.delivery_fee || 0), vr = Number(q.vat_rate == null ? 0.12 : q.vat_rate);
  var incl = lines.filter(function (l) { return !/exempt|zero/i.test(l.vat || ''); }).reduce(function (s, l) { return s + Number(l.qty || 0) * Number(l.price || 0); }, 0);
  /* VAT is inside the VAT-inclusive share of the final total (after the
     discount and delivery fee), not the gross line amounts */
  var base = sub ? total * incl / sub : 0, vat = vr ? Math.round((base - base / (1 + vr)) * 100) / 100 : 0;
  return {sub: sub, total: total, vat: vat};
}

  function list() {
    var l = rows.filter(function (c) { return !q || (c.trade + ' ' + c.city + ' ' + c.person).toLowerCase().indexOf(q) >= 0; });
    $('dm-list').innerHTML = '<style>#dm-list .nw,#dm-list th{white-space:nowrap}</style><table><tr><th class="n">#</th><th>Trade Name</th><th>City</th><th>Payment</th><th>SI/DR</th><th>Mobile</th><th>Contact</th><th>Message via</th><th>Last message</th></tr>' + (l.map(function (c, i) {
      return '<tr class="click" data-dm="' + c.id + '"><td class="n">' + (i + 1) + '</td><td><b>' + esc(c.trade) + '</b></td><td class="nw">' + esc(c.city || '-') + '</td><td class="nw">' + esc(c.payment || '-') + '</td><td class="nw">' + esc(c.doc || '-') + '</td><td class="nw">' + esc(c.mobile || '-') + '</td><td>' + esc(c.person || '-') + '</td>' +
        '<td class="nw">' + (c.ch ? esc(chName(c.ch)) : '<span class="pill o">Not set</span>') + '</td><td class="mut">' + esc(c.last || '-') + '</td></tr>'; }).join('') || '<tr><td colspan="9" class="empty">No clients deliver on ' + esc(V.dday) + '.</td></tr>') + '</table>';
    document.querySelectorAll('[data-dm]').forEach(function (tr) { tr.onclick = function () { dmMessage(all.filter(function (c) { return String(c.id) === tr.getAttribute('data-dm'); })[0], d.company); }; });
  }
  list();
  $('dm-day').onchange = function () { V.dday = this.value; go('delmap', ''); };
  $('dm-q').oninput = function () { V.dq = this.value; q = this.value.toLowerCase(); list(); };
  $('dm-tpl').onclick = function () { dmTemplates(tpls); };
  document.querySelectorAll('[data-qc]').forEach(function (b) { b.onclick = async function () {
    var text = msgGeneral(tpls[+b.getAttribute('data-qc')][1], d.company, V.dday);
    try { await navigator.clipboard.writeText(text); } catch (e) { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    b.textContent = 'Copied \u2713'; setTimeout(function () { b.textContent = 'Copy'; }, 1600);
  }; });
  pollIfBusy('delmap', '');
}
function dmSettings(c, dr, close) {
  dr.innerHTML = '<div class="row"><div><div class="crumb">Delivery Map</div><h1 style="font-size:22px">Message settings - ' + esc(c.trade) + '</h1></div><button class="btn" id="dx">Close</button></div>' +
    '<div class="form"><label class="fl"><span>Messages us on</span><select id="ms-ch">' + MSG_CH.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === (c.ch || 'viber') ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select></label>' +
    fld('Number / username / link', 'ms-h', c.handle || '') + '</div><div class="mut" id="ms-hint"></div><div class="err" id="ms-err"></div><div class="btns"><button class="btn dark" id="ms-go">Save</button></div>';
  var hints = {viber: 'their mobile number (blank = the customer\'s mobile ' + (c.mobile || '-') + ')', viber_group: 'the group\'s invite link (Viber: group info > Invite link)', messenger: 'their Facebook page / username, or m.me link', instagram: 'their Instagram username, e.g. @kapecafe', whatsapp: 'their mobile number (blank = the customer\'s mobile ' + (c.mobile || '-') + ')'};
  var upd = function () { $('ms-hint').textContent = 'Type ' + hints[$('ms-ch').value]; };
  $('ms-ch').onchange = upd; upd();
  $('dx').onclick = close;
  $('ms-go').onclick = async function () {
    var p = {channel: $('ms-ch').value, handle: $('ms-h').value};
    if (await sendW(this, $('ms-err'), 'dmap', 'msgset', c.id, p, close)) { c.ch = p.channel; c.handle = p.handle; sentBox(dr, close, 'Sent - a GOOS laptop saves it in a moment.', 'delmap', ''); }
  };
}
function dmMessage(c, company) {
  if (!c) return;
  drawer(function (dr, close) {
    if (!c.ch) { dmSettings(c, dr, close); return; }
    var tpls = V.dtpl || MSG_TPL0, f = msgFacts(c, company);
    dr.innerHTML = '<div class="row"><div><div class="crumb">Delivery Map</div><h1 style="font-size:22px">Message ' + esc(c.trade) + '</h1><div class="mut">on ' + esc(chName(c.ch)) + (c.handle ? ' \u00b7 ' + esc(c.handle) : '') + '</div></div><button class="btn" id="dx">Close</button></div>' +
      (c.last ? '<div class="mut" style="margin:6px 0 10px">Last message: ' + esc(c.last) + '</div>' : '') +
      '<div class="form"><label class="fl" style="grid-column:1/-1"><span>Template</span><select id="mm-t">' + tpls.map(function (t, i) { return '<option value="' + i + '">' + esc(t[0]) + '</option>'; }).join('') + '</select></label>' +
      '<label class="fl" style="grid-column:1/-1"><span>Message</span><textarea id="mm-x" rows="11"></textarea></label></div>' +
      '<div class="mut">Viber, Messenger and Instagram do not let other apps type into a chat, so GOOS copies the message - just paste it there.</div>' +
      '<div class="err" id="mm-err"></div><div class="btns"><button class="btn" id="mm-set">Message settings</button><button class="btn dark" id="mm-go">Copy &amp; open chat</button></div>';
    var load = function () { $('mm-x').value = msgFill(tpls[+$('mm-t').value][1], f); };
    $('mm-t').onchange = load; load();
    $('dx').onclick = close;
    $('mm-set').onclick = function () { dmSettings(c, dr, close); };
    $('mm-go').onclick = async function () {
      var text = $('mm-x').value, L = msgLink(c.ch, c.handle, c.mobile, text);
      if (!L[0]) { $('mm-err').textContent = L[1]; return; }
      try { await navigator.clipboard.writeText(text); } catch (e) { $('mm-x').select(); document.execCommand('copy'); }
      window.open(L[0], '_blank');
      if (await sendW(this, $('mm-err'), 'dmap', 'msglog', c.id, {channel: c.ch, template: tpls[+$('mm-t').value][0]}, close)) sentBox(dr, close, 'Message copied - paste it in the ' + chName(c.ch) + ' chat and send.', 'delmap', '');
    };
  });
}
function dmTemplates(tpls) {
  var work = tpls.map(function (t) { return [t[0], t[1]]; });
  drawer(function (dr, close) {
    function draw() {
      dr.innerHTML = '<div class="row"><div><div class="crumb">Delivery Map</div><h1 style="font-size:22px">Message templates</h1></div><button class="btn" id="dx">Close</button></div>' +
        '<div class="mut">Shared by everyone. You can use: {customer} {contact} {company} {day} {order} {delivery_date} {items} {total} {dr} {balance} {invoices} {today}</div>' +
        work.map(function (t, i) { return '<div class="card" style="margin-top:10px"><div class="form"><label class="fl" style="grid-column:1/-1"><span>Name</span><input id="tn' + i + '" value="' + esc(t[0]) + '"></label>' +
          '<label class="fl" style="grid-column:1/-1"><span>Text</span><textarea id="tt' + i + '" rows="5">' + esc(t[1]) + '</textarea></label></div><button class="btn" data-tdel="' + i + '" style="color:#8E2A14">Delete</button></div>'; }).join('') +
        '<div class="err" id="tp-err"></div><div class="btns"><button class="btn" id="tp-add">+ Add template</button><button class="btn dark" id="tp-go">Save</button></div>';
      $('dx').onclick = close;
      var keep = function () { work = work.map(function (t, i) { return [$('tn' + i).value, $('tt' + i).value]; }); };
      document.querySelectorAll('[data-tdel]').forEach(function (b) { b.onclick = function () { keep(); if (work.length > 1) work.splice(+b.getAttribute('data-tdel'), 1); draw(); }; });
      $('tp-add').onclick = function () { keep(); work.push(['New template ' + (work.length + 1), 'Hi {contact}! ']); draw(); };
      $('tp-go').onclick = async function () {
        keep(); var items = work.filter(function (t) { return t[0].trim() && t[1].trim(); });
        if (!items.length) { $('tp-err').textContent = 'Keep at least one template.'; return; }
        if (await sendW(this, $('tp-err'), 'dmap', 'tpl', '', {items: items}, close)) { V.dtpl = items; sentBox(dr, close, 'Sent - the templates are saved in a moment.', 'delmap', ''); }
      };
    }
    draw();
  });
}
/* ---------------------------------------------------------------- phone screens */
function pageEmbedded(v) {
  var name = (NAV.filter(function (n) { return n[0] === v; })[0] || [v, v])[1];
  $('main').innerHTML = '<div class="top"><div><div class="crumb">From the GOOS phone app</div><h1>' + esc(name) + '</h1></div><div class="btns">' +
    '<button class="btn" id="reload">\u21bb Refresh</button></div></div>' +
    '<iframe class="frame" id="frm" title="' + esc(name) + '" src="index.html?embed=1&v=' + encodeURIComponent(v) + '"></iframe>';
  $('reload').onclick = function () { try { $('frm').contentWindow.location.reload(); } catch (e) { go(v, ''); } };
}

/* ---------------------------------------------------------------- start */
load();
window.addEventListener('hashchange', function () {
  /* the arg itself may hold ':' (edit:12, soa:10), so only the first ':' splits */
  var h = location.hash.replace(/^#/, ''), i = h.indexOf(':'), p0 = i < 0 ? h : h.slice(0, i), p1 = i < 0 ? '' : h.slice(i + 1);
  if (S.token && p0 && (p0 !== V.page || p1 !== V.arg)) { V.q = ''; go(p0, p1); }
});
if (S.token) { var h0 = location.hash.replace(/^#/, ''), i0 = h0.indexOf(':'); go((i0 < 0 ? h0 : h0.slice(0, i0)) || 'dashboard', i0 < 0 ? '' : h0.slice(i0 + 1)); } else drawLogin('');
</script>
</body>
</html>
