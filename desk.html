<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOOS Web</title>
<link rel="icon" href="icon-192.png">
<style>
:root { --navy: #18233F; --gold: #D9A441; --ground: #F4F3EE; --ink: #1B1F2A; --muted: #5B6273;
  --line: #E6E4DC; --soft: #ECEAE3; --green: #2E7D4F; --blue: #2F5DA8; --orange: #B4501A; --red: #8E2A14; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Segoe UI", Inter, system-ui, sans-serif; background: var(--ground); color: var(--ink); font-size: 14px; }
button, input, select { font: inherit; }
a { color: inherit; }
.shell { display: flex; min-height: 100vh; }
.side { width: 232px; flex: none; background: var(--navy); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 800; font-size: 20px; letter-spacing: .5px; padding: 0 10px; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: #AEB6C8; letter-spacing: 0; margin-top: 2px; }
.rule { height: 2px; background: var(--gold); margin: 14px 10px 10px; border-radius: 2px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #D6DBE6; text-decoration: none; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav:hover { background: rgba(255,255,255,.07); }
.nav.on { background: rgba(217,164,65,.18); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--gold); }
.nav .n { margin-left: auto; background: var(--gold); color: var(--navy); font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
/* 3.99.169 - fits any laptop: the sidebar scrolls on its own, grids wrap
   instead of squeezing, wide tables scroll inside their card, long words
   break - so nothing overlaps on a small screen */
.navs { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
.navs::-webkit-scrollbar { width: 8px; } .navs::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 8px; }
.sect { margin-top: 6px; }
.shead { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; cursor: pointer; padding: 8px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-align: left; }
.shead .car { color: #AEB6C8; width: 10px; } .shead .cnt { margin-left: auto; color: #8194B8; font-weight: 400; }
.shead:hover { background: rgba(255,255,255,.05); border-radius: 8px; }
.slist .nav { padding-left: 22px; }
.nav { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { min-width: 0; }
.card { min-width: 0; overflow-x: auto; }
.card table { min-width: 520px; }
td, th { overflow-wrap: anywhere; }
.top > div:first-child { min-width: 0; } h1 { overflow-wrap: anywhere; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)) !important; }
.grid2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)) !important; }
.row { flex-wrap: wrap; }
.drawer { max-width: 100vw; }
.card::-webkit-scrollbar, .drawer::-webkit-scrollbar { height: 9px; width: 9px; }
.card::-webkit-scrollbar-thumb, .drawer::-webkit-scrollbar-thumb { background: #C9C5B8; border-radius: 8px; }
@media (max-width: 1280px) { .side { width: 210px; } .main { padding: 22px 20px 36px; } }
.me { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 13px; }
.me b { display: block; } .me span { color: #AEB6C8; font-size: 12px; }
.me button { margin-top: 10px; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: none; color: #fff; cursor: pointer; }
.main { flex: 1; min-width: 0; padding: 26px 32px 40px; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb a { cursor: pointer; text-decoration: underline; }
h1 { margin: 4px 0 0; font-size: 28px; color: var(--navy); }
h2 { margin: 0 0 10px; font-size: 16px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { padding: 9px 14px; border-radius: 10px; border: 1px solid #D5D3CA; background: #fff; cursor: pointer; }
.btn.dark { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 26px; font-weight: 700; color: var(--navy); margin-top: 6px; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--gold); }
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #EEECE5; }
.list li:first-child { border-top: 0; }
.list li.click { cursor: pointer; } .list li.click:hover { background: #FAF9F5; }
.mut { color: var(--muted); font-size: 12px; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #E5ECF8; color: #1E4380; white-space: nowrap; }
.pill.g { background: #E3EEE6; color: #1F5A37; } .pill.o { background: #FBEBD8; color: #8A3F10; }
.pill.r { background: #F8E1DA; color: var(--red); } .pill.y { background: var(--soft); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.search { padding: 8px 12px; border: 1px solid #D5D3CA; border-radius: 10px; min-width: 220px; background: #fff; }
.board { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 14px; overflow-x: auto; }
.col { background: var(--soft); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 420px; }
.colh { display: flex; justify-content: space-between; align-items: center; font-weight: 600; padding: 2px 4px 4px; }
.colh i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
.ocard { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.ocard:hover { border-color: var(--gold); }
.ocard .c { font-weight: 600; } .ocard .a { font-weight: 700; font-size: 15px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 8px 8px 0; }
td { padding: 10px 8px 10px 0; border-top: 1px solid #EEECE5; vertical-align: top; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: #FAF9F5; }
.lotrow { display: grid; grid-template-columns: 240px 120px 1fr; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid #EEECE5; }
.lot { display: inline-flex; flex-direction: column; padding: 7px 11px; border-radius: 12px; font-size: 12px; min-width: 128px; }
.lot b { font-size: 13px; }
.alert { padding: 13px 18px; border-radius: 14px; background: #F8E1DA; color: var(--red); }
.ok { padding: 13px 18px; border-radius: 14px; background: #E3EEE6; color: #1F5A37; }
.empty { color: var(--muted); padding: 18px 0; }
.drawer-bg { position: fixed; inset: 0; background: rgba(24,35,63,.35); display: flex; justify-content: flex-end; z-index: 9; }
.drawer { width: min(680px, 100%); height: 100%; background: #fff; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy); }
.login { background: #fff; border-radius: 18px; padding: 32px; width: min(380px, 92vw); display: flex; flex-direction: column; gap: 12px; }
.login h2 { margin: 0; font-size: 24px; color: var(--navy); }
.login input { padding: 11px 12px; border: 1px solid #D5D3CA; border-radius: 10px; }
.err { color: var(--red); min-height: 18px; font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.fl input, .fl select { padding: 9px 11px; border: 1px solid #D5D3CA; border-radius: 10px; color: var(--ink); background: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
/* 3.99.161 - phone-size screens: the menu folds into a top bar */
.mtop { display: none; }
.frame { width: 100%; border: 0; border-radius: 16px; background: #FAF5EA; min-height: calc(100vh - 150px); }
@media (max-width: 760px) {
  .shell { display: block; }
  .mtop { display: flex; align-items: center; gap: 12px; background: var(--navy); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 8; }
  .mtop b { font-size: 17px; } .mtop button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  .side { position: fixed; left: 0; top: 0; z-index: 10; height: 100vh; transform: translateX(-105%); transition: transform .2s; width: 250px; overflow-y: auto; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(24,35,63,.35); }
  .main { padding: 16px 14px 32px; }
  h1 { font-size: 23px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi .v { font-size: 20px; }
  .grid2, .form { grid-template-columns: 1fr; }
  .board { grid-template-columns: repeat(5, 78vw); }
  .lotrow { grid-template-columns: 1fr; gap: 8px; }
  .search { min-width: 0; width: 100%; }
  table { display: block; overflow-x: auto; }
  .drawer { padding: 18px 14px; }
  .frame { min-height: calc(100vh - 120px); border-radius: 0; }
}
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } .side { width: 190px; } .lotrow { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* GOOS Web (3.99.171) - the laptop-browser face of GOOS. It reads the
   SAME server functions as the phone app (goos_m_*), so it shows exactly what
   GOOS shows and needs nothing new on the server. Changes that move stock or
   money stay in desktop GOOS for now: those rules live there once, and a
   second copy here would drift. */
var CFG = {url: 'https://gfgavltifdkyzvmhyyim.supabase.co', key: 'sb_publishable_CQ1ChWjD5ZPNlZZXCK71FA_704f-xRp', version: '3.99.171'};
var PESO = '\u20b1';
var S = {token: '', name: '', user: '', role: '', views: []};
var V = {page: 'dashboard', arg: '', agent: '', q: '', cache: {}};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function money(n) { n = Number(n || 0); return PESO + ' ' + n.toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function money0(n) { n = Number(n || 0); return PESO + ' ' + Math.round(n).toLocaleString('en-PH'); }
function num(n) { n = Number(n || 0); return (Math.round(n * 100) / 100).toLocaleString('en-PH'); }
function day(s) { s = String(s || '').slice(0, 10); return s; }
function daysAgo(s) {
  var d = new Date(String(s || '').slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return null;
  var t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((t - d) / 86400000);
}
function prettyDay(s) {
  var d = new Date(String(s || '').slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return s || '-';
  var n = daysAgo(s);
  if (n === 0) return 'Today'; if (n === -1) return 'Tomorrow'; if (n === 1) return 'Yesterday';
  return d.toLocaleDateString('en-PH', {month: 'short', day: 'numeric'});
}
function save() {
  try { localStorage.setItem('goos_web', JSON.stringify(S)); } catch (e) {}
  /* the phone screens shown inside this page read their sign-in from here */
  try { localStorage.setItem('goos_phone', JSON.stringify({token: S.token, name: S.name, user: S.user, views: S.views})); } catch (e) {}
}
function load() { try { var v = JSON.parse(localStorage.getItem('goos_web') || '{}');
  S.token = v.token || ''; S.name = v.name || ''; S.user = v.user || ''; S.role = v.role || ''; S.views = v.views || []; } catch (e) {} }
function can(v) { return S.role === 'CEO' || (S.views || []).indexOf(v) >= 0; }

async function rpc(fn, body) {
  var h = {'Content-Type': 'application/json', 'apikey': CFG.key};
  if (/^eyJ/.test(CFG.key)) h['Authorization'] = 'Bearer ' + CFG.key;
  var r = await fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn,
                      {method: 'POST', cache: 'no-store', headers: h, body: JSON.stringify(body)});
  if (!r.ok) throw new Error('The server said ' + r.status + '.');
  return r.json();
}
/* One read. A sign-out from the server (password changed, account switched
   off) sends the user back to sign in instead of showing an empty page. */
async function data(view, arg) {
  var r = await rpc('goos_m_data', {p_token: S.token, p_view: view, p_arg: arg || ''});
  if (r && r.ok === false) {
    if (r.error === 'signin') { S.token = ''; save(); drawLogin('Please sign in again.'); throw new Error('signin'); }
    throw new Error(r.error || 'GOOS could not open this.');
  }
  return r && r.data !== undefined ? r.data : r;
}
async function pbkdf2Hex(password, saltHex) {
  var enc = new TextEncoder();
  var salt = new Uint8Array(saltHex.match(/../g).map(function (h) { return parseInt(h, 16); }));
  var key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: 100000}, key, 256);
  return Array.prototype.map.call(new Uint8Array(bits), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}

/* ---------------------------------------------------------------- sign in */
function drawLogin(msg) {
  $('app').innerHTML = '<div class="login-wrap"><div class="login"><h2>GOOS Web</h2>' +
    '<div class="mut">Grain Ola Operating System. Sign in with your GOOS username and password.</div>' +
    '<input id="u" autocomplete="username" placeholder="Username" autocapitalize="none">' +
    '<input id="p" type="password" autocomplete="current-password" placeholder="Password">' +
    '<div class="err" id="err">' + esc(msg || '') + '</div>' +
    '<button class="btn dark" id="go">Sign in</button>' +
    '<div class="foot">GOOS Web ' + esc(CFG.version) + '</div></div></div>';
  $('go').onclick = signIn;
  $('p').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };
  $('u').focus();
}
async function signIn() {
  var u = $('u').value.trim(), p = $('p').value;
  if (!u || !p) { $('err').textContent = 'Enter your username and password.'; return; }
  $('go').disabled = true; $('err').textContent = 'Signing in...';
  try {
    var salt = await rpc('goos_m_salt', {p_user: u});
    var h = await pbkdf2Hex(p, String(salt));
    var r = await rpc('goos_m_login', {p_user: u, p_hash: h});
    if (!r.ok) { $('err').textContent = r.error; $('go').disabled = false; return; }
    S.token = r.token; S.name = r.name; S.user = u; S.role = r.role || ''; S.views = r.views || []; save();
    go('dashboard', '');
  } catch (e) {
    $('err').textContent = 'Could not reach GOOS. Check the internet and try again.';
    $('go').disabled = false;
  }
}
async function signOut() {
  try { await rpc('goos_m_logout', {p_token: S.token}); } catch (e) {}
  S.token = ''; save(); drawLogin('');
}

/* ---------------------------------------------------------------- frame */
var NAV = [['dashboard', 'Dashboard', '\u2302', ''],
  ['advisor', 'Strategy Advisor', '\u2605', 'MANAGEMENT'], ['approvals', 'For Approval', '\u2713', 'MANAGEMENT'],
  ['pricing', 'Pricing', '\u20b1', 'MANAGEMENT'], ['accounting', 'Accounting', '\u2211', 'MANAGEMENT'],
  ['expenses', 'Expenses', '\u2296', 'MANAGEMENT'], ['purchases', 'Purchases', '\u229e', 'MANAGEMENT'],
  ['collections', 'Collections', '\u20b1', 'MANAGEMENT'],
  ['orders', 'Logistics', '\u27f6', 'COMMISSARY ADMINISTRATION'],
  ['production', 'Schedule Production', '\u2699', 'MANUFACTURING'],
  ['qa', 'QA Database', '\u2714', 'QUALITY ASSURANCE'],
  ['raw', 'Raw Materials', '\u2749', 'INVENTORY MANAGEMENT'], ['finished', 'Finished Goods', '\u25d3', 'INVENTORY MANAGEMENT'],
  ['lots', 'Lots & Expiry', '\u25d4', 'INVENTORY MANAGEMENT'],
  ['quotes', 'Sales Quotations', '\u270e', 'SALES DEPARTMENT'], ['customers', 'Customer Info', '\u2637', 'SALES DEPARTMENT']];
/* 3.99.169 - the sidebar is the desktop's: the same sections, names and
   order, each a fold-out list, with the section colours */
var SECT = ['', 'MANAGEMENT', 'COMMISSARY ADMINISTRATION', 'MANUFACTURING', 'QUALITY ASSURANCE', 'INVENTORY MANAGEMENT', 'SALES DEPARTMENT'];
var SECT_COL = {'': '#8C9BE0', 'MANAGEMENT': '#D9A441', 'COMMISSARY ADMINISTRATION': '#4CAF7D', 'MANUFACTURING': '#E07A62',
  'QUALITY ASSURANCE': '#3FB59D', 'INVENTORY MANAGEMENT': '#A58BD6', 'SALES DEPARTMENT': '#4FB3C2'};
/* 3.99.161 - the phone app's screens GOOS Web has not rebuilt yet open the
   phone's own screen inside this page, signed in, so everything the phone
   does is here too. One by one they are rebuilt in the web's own layout. */
var EMBEDDED = {advisor: 1, production: 1, quotes: 1, collections: 1, qa: 1};
function frame(inner) {
  var openS = {}; try { openS = JSON.parse(localStorage.getItem('goos_web_open') || '{}'); } catch (e) {}
  var nav = SECT.map(function (sec) {
    var items = NAV.filter(function (n) { return n[3] === sec && (n[0] === 'dashboard' || can(n[0])); });
    if (!items.length) return '';
    var here = items.some(function (n) { return n[0] === V.page; }), isOpen = !sec || here || openS[sec];
    var list = items.map(function (n) {
      return '<button class="nav' + (V.page === n[0] ? ' on' : '') + '" data-go="' + n[0] + '"><span style="color:' + SECT_COL[sec] + '">' + n[2] + '</span>' + esc(n[1]) + '</button>'; }).join('');
    if (!sec) return list;
    return '<div class="sect"><button class="shead" data-sect="' + esc(sec) + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '"><span class="car">' + (isOpen ? '\u25be' : '\u25b8') + '</span>' +
      '<span style="color:' + SECT_COL[sec] + '">' + esc(sec) + '</span><span class="cnt">' + items.length + '</span></button><div class="slist"' + (isOpen ? '' : ' hidden') + '>' + list + '</div></div>';
  }).join('');
  $('app').innerHTML = '<div class="mtop"><button id="burger" aria-label="Menu">\u2630</button><b>GOOS</b></div><div class="shell"><aside class="side" id="side"><div class="brand">GRAIN OLA<small>GOOS Web</small></div><div class="rule"></div><nav class="navs">' +
    nav + '</nav><div class="me"><b>' + esc(S.name) + '</b><span>' + esc(S.role) + '</span>' +
    '<button id="out">Sign out</button><div class="foot" style="color:#AEB6C8;margin-top:8px">GOOS Web ' + esc(CFG.version) + '</div></div></aside>' +
    '<main class="main" id="main">' + inner + '</main></div><button id="totop" title="Back to the top" style="position:fixed;right:18px;bottom:18px;display:none;border:0;border-radius:50%;width:42px;height:42px;background:#18233F;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:7">\u2191</button>';
  $('out').onclick = signOut;
  $('totop').onclick = function () { window.scrollTo({top: 0, behavior: 'smooth'}); };
  window.onscroll = function () { var b = $('totop'); if (b) b.style.display = window.scrollY > 500 ? 'block' : 'none'; };
  document.querySelectorAll('[data-sect]').forEach(function (h) { h.onclick = function () {
    var box = h.nextSibling, open = box.hasAttribute('hidden'), st = {};
    try { st = JSON.parse(localStorage.getItem('goos_web_open') || '{}'); } catch (e) {}
    if (open) box.removeAttribute('hidden'); else box.setAttribute('hidden', '');
    h.setAttribute('aria-expanded', open ? 'true' : 'false'); h.firstChild.textContent = open ? '\u25be' : '\u25b8';
    st[h.getAttribute('data-sect')] = open; try { localStorage.setItem('goos_web_open', JSON.stringify(st)); } catch (e) {}
  }; });
  var onb = document.querySelector('.nav.on'); if (onb && onb.scrollIntoView) onb.scrollIntoView({block: 'nearest'});
  $('burger').onclick = function (e) { e.stopPropagation(); $('side').classList.toggle('open'); };
  $('side').onclick = function (e) { if (e.target === $('side')) $('side').classList.remove('open'); };
  wire(document);
}
function wire(root) {
  root.querySelectorAll('[data-go]').forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); V.q = ''; go(el.getAttribute('data-go'), el.getAttribute('data-arg') || ''); };
  });
  root.querySelectorAll('[data-pay]').forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); var p = el.getAttribute('data-pay').split(':'); openPay(p[0], p[1] || ''); };
  });

/* The board columns, from what GOOS records: new and confirmed orders, then

var COLS = [['new', 'New', '#5B6273'], ['confirmed', 'Confirmed', '#2F5DA8'], ['unpaid', 'Delivered \u00b7 unpaid', '#B4501A'],
            ['overdue', 'Overdue (30+ days)', '#8E2A14'], ['paid', 'Paid', '#2E7D4F']];
function bucket(o) {
  var bal = Number(o.total || 0) - Number(o.paid || 0);
  if (o.state === 'new') return 'new';
  if (o.state === 'confirmed') return 'confirmed';
  if (o.state === 'dispatched' || o.state === 'recorded') {
    if (bal <= 0.009) return 'paid';
    var a = daysAgo(o.day);
    return a !== null && a > 30 ? 'overdue' : 'unpaid';
  }
  return '';
}
function ocard(o, b) {
  var bal = Number(o.total || 0) - Number(o.paid || 0), a = daysAgo(o.day), pill = '';
  if (b === 'overdue') pill = '<span class="pill r">' + a + ' days</span>';
  else if (b === 'unpaid') pill = '<span class="pill o">' + money0(bal) + ' owed</span>';
  else if (b === 'paid') pill = '<span class="pill g">Paid</span>';
  else if (a !== null && a < 0) pill = '<span class="pill">' + esc(prettyDay(o.day)) + '</span>';
  else if (a === 0) pill = '<span class="pill">Today</span>';
  return '<div class="ocard" data-order="' + o.id + '"><div class="row"><span class="c">' + esc(o.customer_name || '-') + '</span>' + pill + '</div>' +

/* ---------------------------------------------------------------- payments */
/* Payments go through the SAME server functions as the phone (goos_m_pay,
   goos_m_paybatch): they are queued, and an open GOOS laptop posts them with
   the desktop's own collection rules, journal included. Nothing is posted by
   this page itself. */
function defaultAccount(accts, method) {
  var m = String(method || '').toLowerCase();
  if (/cash|cod/.test(m)) { var c = accts.find(function (a) { return /cash on hand|petty/i.test(a[1]); }); if (c) return c[0]; }
  if (/gcash|maya/.test(m)) { var g = accts.find(function (a) { return /gcash|maya|e-?wallet/i.test(a[1]); }); if (g) return g[0]; }
  var b = accts.find(function (a) { return /bank/i.test(a[1]) && !/equivalent/i.test(a[1]); });
  return (b || accts[0] || [''])[0];
}
function payTax(owed, rate, vr) {
  if (!rate) return 0;
  var base = vr ? Math.round(owed / (1 + vr) * 100) / 100 : owed;
  return Math.round(base * rate * 100) / 100;
}
/* oldest first, the last one part-paid if the money runs out - the same rule
   as GOOS on the laptop and the phone */
function batchAlloc(list, cash, rate, vr) {
  var left = Math.round(cash * 100) / 100, out = [];

    var owed = Number(x.bal);
    if (left <= 0.004 || owed <= 0) return;
    var tax = payTax(owed, rate, vr), need = Math.round((owed - tax) * 100) / 100;
    if (left + 0.004 >= need) { out.push({id: x.id, cash: need, cwt: tax, full: true}); left = Math.round((left - need) * 100) / 100; }
    else { var settle = k > 0 ? Math.round(left / k * 100) / 100 : left;
           out.push({id: x.id, cash: left, cwt: rate ? Math.round((settle - left) * 100) / 100 : 0, full: false}); left = 0; }
  });

}

function barsSvg(months, key, color) {
  var w = 640, h = 190, pad = 34, n = months.length || 1, vals = months.map(function (m) { return Number(m[key] || 0); });
  var mx = Math.max.apply(null, vals.concat([0])), mn = Math.min.apply(null, vals.concat([0])), span = (mx - mn) || 1;
  var y0 = pad / 2 + (h - pad) * (mx / span), bw = (w - 20) / n * 0.62;
  var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:820px;height:auto;display:block;margin:8px auto 0" role="img"><line x1="10" x2="' + (w - 10) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="#D5D3CA"/>';
  months.forEach(function (m, i) {
    var v = Number(m[key] || 0), x = 10 + (w - 20) / n * i + ((w - 20) / n - bw) / 2, bh = Math.abs(v) / span * (h - pad);
    if (v) out += '<rect x="' + x.toFixed(1) + '" y="' + (v >= 0 ? y0 - bh : y0).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh, 1).toFixed(1) + '" rx="4" fill="' + (v < 0 ? '#B4501A' : color) + '"><title>' + esc(m.month) + ': ' + money0(v) + '</title></rect>';
    out += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 4) + '" font-size="11" text-anchor="middle" fill="#5B6273">' + esc(m.month.slice(5)) + '</text>';
  });
  return out + '</svg>';

/* ---------------------------------------------------------------- product groups */
/* 3.99.171 - Finished Goods and Lots & Expiry are grouped OURS / CUSTOM by
   category, the same groups as the desktop (worked out by a GOOS laptop with
   fg_groups and published) */
async function fgGroups() {
  if (V.cache.fgg && V.cache.fggAt > Date.now() - 300000) return V.cache.fgg;
  var r;
  try { r = await wreq('fgg', 'get'); } catch (e) { if (e.message === 'signin') throw e; return {}; }
  V.cache.fgg = r.groups || {}; V.cache.fggAt = Date.now();
  return V.cache.fgg;
}
function groupOf(G, fgId, name) {
  var x = G[String(fgId)] || G['n:' + String(name || '').toLowerCase()];
  return x || {k: '9', label: 'OTHER - not in Standardized Recipes'};
}
function groupRows(items, keyFn) {
  /* -> [[label, [items...]], ...] in the groups' own order */
  var by = {}, order = [];
  items.forEach(function (it) { var gr = keyFn(it); if (!by[gr.label]) { by[gr.label] = {k: gr.k, rows: []}; order.push(gr.label); } by[gr.label].rows.push(it); });
  order.sort(function (a, b) { return String(by[a].k).localeCompare(String(by[b].k)) || a.localeCompare(b); });
  return order.map(function (l) { return [l, by[l].rows]; });
}
function divider(label, n, cols) {
  var custom = /^CUSTOM/.test(label), other = /^OTHER/.test(label);
  return '<tr class="gdiv"><td colspan="' + cols + '" style="background:' + (custom ? '#FBEBD8' : (other ? '#ECEAE3' : '#E5ECF8')) + ';color:' + (custom ? '#8A3F10' : (other ? '#5B6273' : '#1E4380')) +
    ';font-weight:700;letter-spacing:.3px;border-radius:8px">\u25be ' + esc(label) + ' <span style="font-weight:400">(' + n + ')</span></td></tr>';
}

async function pageFinished() {
  var got = await Promise.all([data('finished'), can('lots') ? data('lots') : Promise.resolve([]), fgGroups()]);
  var fg = got[0] || [], lots = got[1] || [], G = got[2] || {}, q = V.q.toLowerCase(), f = V.arg || '';
  var lotsBy = {}; lots.forEach(function (l) { (lotsBy[l.product] = lotsBy[l.product] || []).push(l); });
  function state(r) { var s = Number(r.stock || 0), p = Number(r.par || 0); return s <= 0 ? 'out' : (p > 0 && s <= p ? 'low' : 'ok'); }
  var counts = {low: 0, out: 0}; fg.forEach(function (r) { var s = state(r); if (counts[s] !== undefined) counts[s]++; });
  var list = fg.filter(function (r) { return (!f || state(r) === f) && (!q || String(r.name).toLowerCase().indexOf(q) >= 0); });
  var groups = groupRows(list, function (r) { return groupOf(G, r.id, r.name); });
  var body = groups.map(function (gp) {
    return divider(gp[0], gp[1].length, 6) + gp[1].sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); }).map(function (r) {
      var s = state(r), ls = (lotsBy[r.name] || []).slice().sort(function (a, b) { return String(a.expires || '9999').localeCompare(String(b.expires || '9999')); });
      var inLots = ls.reduce(function (t, l) { return t + Number(l.left_qty || 0); }, 0), mis = Math.abs(inLots - Number(r.stock || 0)) > 0.009 && can('lots');
      return '<tr class="click" data-fg="' + r.id + '"><td><b>' + esc(r.name) + '</b></td><td>' + esc(r.unit) + '</td><td class="n"><b>' + num(r.stock) + '</b>' + (mis ? '<br><span class="pill r">lots ' + num(inLots) + '</span>' : '') + '</td>' +
        '<td>' + (ls.length ? ls.map(function (l) { return esc(l.lot) + ': ' + num(l.left_qty) + (l.expires ? ' (exp ' + esc(String(l.expires).slice(5)) + ')' : ''); }).join(', ') : '<span class="mut">-</span>') + '</td>' +
        '<td class="n">' + (Number(r.par) ? num(r.par) : '-') + '</td><td><span class="pill ' + ({out: 'r', low: 'o', ok: 'g'})[s] + '">' + ({out: 'OUT OF STOCK', low: 'RUNNING LOW', ok: 'OK'})[s] + '</span></td></tr>'; }).join('');
  }).join('');
  $('main').innerHTML = head('Inventory', 'Finished Goods', (can('lots') || can('finished')) ? '<button class="btn" id="la-new">+ Count / adjust by LOT</button>' : '') +
    '<div class="kpis">' + kpi('Products', String(fg.length), '') + kpi('Running low', String(counts.low), '', 'finished', 'low') + kpi('Out of stock', String(counts.out), '', 'finished', 'out') + '</div>' +
    '<div class="card"><div class="row" style="margin-bottom:10px;flex-wrap:wrap"><div class="chips">' +
    [['', 'All'], ['low', 'Running low'], ['out', 'Out of stock']].map(function (c) { return '<span class="chip' + (f === c[0] ? ' on' : '') + '" data-ff="' + c[0] + '">' + c[1] + '</span>'; }).join('') +
    '</div><input class="search" id="q" placeholder="Search product" value="' + esc(V.q) + '"></div>' +
    '<table><tr><th>Product</th><th>Unit</th><th class="n">Stock</th><th>In its lots (send first)</th><th class="n">Par</th><th>Status</th></tr>' + (body || '<tr><td colspan="6" class="empty">Nothing matches.</td></tr>') + '</table>' +
    '<div class="mut" style="margin-top:10px">Grouped OURS / CUSTOM by the Standardized Recipes category, as on the desktop. Click a product to count or adjust it by LOT.</div></div>';
  document.querySelectorAll('[data-ff]').forEach(function (el) { el.onclick = function () { go('finished', el.getAttribute('data-ff')); }; });
  document.querySelectorAll('[data-fg]').forEach(function (tr) { tr.onclick = function () { if (can('lots') || can('finished')) openLotAdjust(tr.getAttribute('data-fg')); }; });
  if ($('la-new')) $('la-new').onclick = function () { openLotAdjust(''); };
  var qi = $('q'), t = null;
  qi.oninput = function () { clearTimeout(t); t = setTimeout(function () { V.q = qi.value; var pos = qi.value.length; go('finished', V.arg).then(function () { var n = $('q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }, 300); };
}
